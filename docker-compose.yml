services:
  tvtrac:
    build: .
    container_name: tvtrac
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override paths inside the container to the mount points
      - MEDIA_ROOT=/media/tv
      - MEDIA_ROOT_MOVIES=/media/movies
    volumes:
      - ./data:/app/data
      - ${MEDIA_HOST_TV_PATH:-/media/tv}:/media/tv:ro
      - ${MEDIA_HOST_MOVIES_PATH:-/media/movies}:/media/movies:ro
    restart: unless-stopped
