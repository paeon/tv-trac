<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TV-Trac — Movie</title>
        <script src="/static/app.js"></script>
        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e94560' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='7' width='20' height='14' rx='2'/%3E%3Cpolyline points='17 2 12 7 7 2'/%3E%3C/svg%3E"
        />
        <style>
            :root {
                --bg: #f4f6f9;
                --surface: #ffffff;
                --accent: #e94560;
                --text: #1a1a2e;
                --text-muted: #6b7280;
                --border: #e0e4e8;
                --content-max-width: 960px;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.6;
            }
            header {
                background: var(--surface);
                padding: 1.5rem 2rem;
                border-bottom: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            header h1 {
                font-size: 1.5rem;
                color: var(--accent);
            }
            header a {
                color: var(--text-muted);
                text-decoration: none;
                font-size: 0.85rem;
            }
            header a:hover {
                color: var(--accent);
            }
            nav {
                display: flex;
                gap: 0;
                border-bottom: 1px solid var(--border);
                margin-bottom: 1rem;
            }
            nav a {
                color: var(--text-muted);
                text-decoration: none;
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
                border-bottom: 2px solid transparent;
                cursor: pointer;
            }
            nav a.active {
                color: var(--accent);
                border-bottom-color: var(--accent);
            }
            main {
                max-width: var(--content-max-width);
                margin: 2rem auto;
                padding: 0 1rem;
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1.5rem;
                margin-bottom: 1rem;
            }
            .badge {
                display: inline-block;
                padding: 0.15rem 0.6rem;
                border-radius: 12px;
                font-size: 0.75rem;
                font-weight: 600;
            }
            .badge-watched {
                background: #2ecc71;
                color: #fff;
            }
            .badge-unwatched {
                background: var(--border);
                color: var(--text-muted);
            }
            .poster {
                width: 180px;
                height: 270px;
                object-fit: cover;
                border-radius: 8px;
                float: left;
                margin-right: 1.5rem;
                margin-bottom: 1rem;
                background: var(--border);
            }
            .show-header {
                display: flex;
                flex-wrap: wrap;
                align-items: flex-start;
            }
            .show-info {
                flex: 1;
                min-width: 250px;
            }
            .show-info h2 {
                font-size: 1.6rem;
                margin-bottom: 0.3rem;
            }
            .show-info .year {
                color: var(--text-muted);
                font-size: 1rem;
            }
            .show-info .overview {
                margin-top: 0.75rem;
                font-size: 0.95rem;
            }
            .meta {
                color: var(--text-muted);
                font-size: 0.8rem;
                margin-top: 0.5rem;
            }
            .ext-link {
                color: var(--accent);
                text-decoration: none;
                font-size: 0.8rem;
            }
            .loading {
                color: var(--text-muted);
                font-style: italic;
            }
            .popover {
                position: fixed;
                z-index: 1000;
                background: var(--surface);
                border: 1px solid var(--accent);
                border-radius: 8px;
                padding: 0.75rem 1rem;
                font-size: 0.85rem;
                color: var(--text);
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            }
            .clearfix::after {
                content: "";
                display: table;
                clear: both;
            }
        </style>
    </head>
    <body>
        <header>
            <div>
                <div style="display: flex; align-items: center; gap: 0.5rem">
                    <svg
                        width="28"
                        height="28"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="#e94560"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <rect x="2" y="7" width="20" height="14" rx="2" />
                        <polyline points="17 2 12 7 7 2" />
                    </svg>
                    <h1><a href="/" style="color: inherit; text-decoration: none; font-size: inherit">TV-Trac</a></h1>
                </div>
                <p
                    style="
                        color: var(--text-muted);
                        font-size: 0.75rem;
                        margin-top: 0.1rem;
                    "
                >
                    Track your TV shows &amp; movies
                </p>
            </div>
            <div style="display:flex;align-items:center;gap:0.75rem;">
                <button
                    id="locale-toggle"
                    onclick="TVTracI18n.openPicker(this, onLocaleSelect, event)"
                    title="Change date/time format"
                    style="background:transparent;border:none;height:2rem;display:inline-flex;align-items:center;justify-content:center;padding:0 0.5rem;font-size:1rem;cursor:pointer;line-height:1;"
                >🏳️</button>
                <button
                    id="width-toggle"
                    onclick="TVTracWidth.cycle(this)"
                    title="Width: 960px"
                    style="background:#e0e4e8;border:none;color:var(--text);height:2rem;display:inline-flex;align-items:center;justify-content:center;padding:0 0.8rem;border-radius:6px;font-size:0.85rem;cursor:pointer;line-height:1;"
                >← 960px →</button>
                <a href="/?tab=movies">← Back to movies</a>
            </div>
        </header>
        <nav>
            <a href="/">📺 Shows</a>
            <a href="/?tab=movies" class="active">🎬 Movies</a>
            <a href="/recent-episodes">🕒 Recent Episodes</a>
        </nav>
        <main>
            <div id="detail" class="loading">Loading...</div>
        </main>

        <script>
            var MOVIE_ID = {{ movie_id }};

            function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

            var allGroups = [];
            var groupsLoaded = false;

            async function ensureGroups() {
                if (groupsLoaded) return;
                try {
                    var gr = await fetch('/api/groups');
                    if (gr.ok) allGroups = await gr.json();
                } catch (e) { allGroups = []; }
                groupsLoaded = true;
            }

            async function loadDetail() {
                await ensureGroups();
                var el = document.getElementById('detail');
                try {
                    var resp = await fetch('/api/movies/' + MOVIE_ID);
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    var m = await resp.json();
                    document.title = m.title + ' — TV-Trac';
                    el.innerHTML = render(m);
                } catch (e) {
                    el.innerHTML = '<p style="color:var(--accent);">Failed to load: ' + escapeHtml(e.message) + '</p>';
                }
            }

            function render(m) {
                return '<div class="card clearfix">' +
                    '<div class="show-header">' +
                    (m.poster_path ? '<img class="poster" src="' + m.poster_path + '" onerror="this.style.display=\'none\'">' : '') +
                    '<div class="show-info">' +
                        '<h2>' + escapeHtml(m.title) + ' <span class="year">(' + (m.first_aired ? m.first_aired.substring(0,4) : '') + ')</span></h2>' +
                        '<span class="badge ' + (m.watched ? 'badge-watched' : 'badge-unwatched') + '">' + (m.watched ? '✓ watched' : 'unwatched') + '</span>' +
                        (m.watched_at ? ' <span style="color:var(--accent);font-size:0.75rem;cursor:pointer;text-decoration:underline;" onclick="openCalendar(event)" title="Change watched date">(' + formatDateLong(m.watched_at.substring(0,10)) + ')</span>' : '') +
                        ((m.first_aired || m.created_at)
                            ? '<div class="meta">' +
                                (m.first_aired ? 'Released: ' + formatDateLong(m.first_aired) : '') +
                                (m.first_aired && m.created_at ? ' &nbsp;·&nbsp; ' : '') +
                                (m.created_at ? 'Date added: ' + formatDateLong(m.created_at.substring(0, 10)) : '') +
                              '</div>'
                            : '') +
                        (m.runtime ? '<div class="meta">Runtime: ' + m.runtime + 'm</div>' : '') +
                        '<div class="meta" style="display:flex;gap:0.5rem;flex-wrap:wrap;">' +
                            (m.tmdb_id ? '<a class="ext-link" href="https://www.themoviedb.org/movie/' + m.tmdb_id + '" target="_blank">TMDB ↗</a>' : '') +
                            (m.imdb_id ? '<a class="ext-link" href="https://www.imdb.com/title/' + m.imdb_id + '/" target="_blank">IMDb ↗</a>' : '<span class="ext-link" onclick="editImdb(event)" style="cursor:pointer;">Add IMDb ID</span>') +
                        '</div>' +
                        (m.overview ? '<p class="overview">' + escapeHtml(m.overview) + '</p>' : '') +
                        '<div style="margin-top:0.75rem;display:flex;gap:0.5rem;flex-wrap:wrap;">' +
                            '<button onclick="toggleWatched(' + m.id + ',' + (!m.watched) + ')" style="background:var(--border);color:var(--text);border:none;padding:0.3rem 0.9rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">' + (m.watched ? 'Mark unwatched' : 'Mark watched') + '</button>' +
                            '<button onclick="toggleWatchlist(' + m.id + ',' + (!m.watchlist) + ')" style="' + (m.watchlist ? 'background:var(--accent);color:#fff;' : 'background:var(--border);color:var(--text);') + 'border:none;padding:0.3rem 0.9rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">' + (m.watchlist ? '★ On Watchlist' : '☆ Add to Watchlist') + '</button>' +
                            '<button onclick="toggleHidden(' + m.id + ',' + (!m.hidden) + ')" style="background:var(--border);color:var(--text);border:none;padding:0.3rem 0.9rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">' + (m.hidden ? 'Unhide from listings' : 'Hide from listings') + '</button>' +
                        '</div>' +
                        '<div style="margin-top:0.75rem;">' +
                            '<span style="font-size:0.8rem;color:var(--text-muted);margin-right:0.5rem;">Rating:</span>' +
                            renderStars(m.id, m.rating) +
                        '</div>' +
                    '</div>' +
                    '</div>' +
                    '</div>' +
                    '<div class="card">' +
                        '<div style="margin-bottom:0.5rem;"><strong>Notes</strong>' +
                            '<button onclick="editNotes(event)" style="background:none;border:1px solid var(--border);color:var(--text);padding:0.15rem 0.6rem;border-radius:4px;font-size:0.7rem;margin-left:0.5rem;cursor:pointer;">' + (m.notes ? 'Edit' : 'Add') + '</button>' +
                        '</div>' +
                        '<div id="notes-display">' + (m.notes ? escapeHtml(m.notes) : '<span style="color:var(--text-muted);font-size:0.8rem;">No notes yet</span>') + '</div>' +
                    '</div>' +
                    '<div class="card">' +
                        '<div style="margin-bottom:0.5rem;"><strong>Groups</strong></div>' +
                        renderGroupsSection(m) +
                    '</div>';
            }

            function renderGroupsSection(m) {
                var current = m.group_names || [];
                var assigned = allGroups.filter(function (g) { return current.indexOf(g.name) !== -1; });
                var available = allGroups.filter(function (g) { return current.indexOf(g.name) === -1; });
                var chips = assigned.map(function (g) {
                    return '<span style="display:inline-flex;align-items:center;gap:0.35rem;background:var(--border);border-radius:999px;padding:0.15rem 0.6rem;font-size:0.75rem;margin:0 0.3rem 0.3rem 0;">' +
                        escapeHtml(g.name) +
                        '<span onclick="removeGroup(' + g.id + ')" style="cursor:pointer;color:var(--text-muted);font-weight:700;" title="Remove from group">×</span>' +
                    '</span>';
                }).join('');
                var addControls = '';
                if (available.length) {
                    addControls += '<select id="group-add-select" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:0.3rem 0.5rem;font-size:0.75rem;">' +
                        '<option value="">Add to group…</option>' +
                        available.map(function (g) { return '<option value="' + g.id + '">' + escapeHtml(g.name) + '</option>'; }).join('') +
                    '</select> ' +
                    '<button onclick="addGroup()" style="background:var(--accent);color:#fff;border:none;padding:0.3rem 0.8rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">Add</button>';
                }
                var newGroup = '<span style="display:inline-flex;align-items:center;gap:0.4rem;">' +
                    '<input id="new-group-name" type="text" placeholder="New group name" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:0.3rem 0.5rem;font-size:0.75rem;width:140px;">' +
                    '<button onclick="createAndAddGroup()" style="background:var(--border);color:var(--text);border:none;padding:0.3rem 0.8rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">Create &amp; add</button>' +
                '</span>';
                return (chips || '<span style="color:var(--text-muted);font-size:0.8rem;">No groups yet</span>') +
                    '<div style="margin-top:0.5rem;display:flex;align-items:center;flex-wrap:wrap;gap:0.4rem;">' + addControls + newGroup + '</div>';
            }

            async function addGroup() {
                var sel = document.getElementById('group-add-select');
                if (!sel || !sel.value) return;
                await fetch('/api/movies/' + MOVIE_ID + '/groups/' + sel.value, { method: 'POST' });
                loadDetail();
            }

            async function removeGroup(groupId) {
                await fetch('/api/movies/' + MOVIE_ID + '/groups/' + groupId, { method: 'DELETE' });
                loadDetail();
            }

            async function createAndAddGroup() {
                var input = document.getElementById('new-group-name');
                var name = input ? input.value.trim() : '';
                if (!name) return;
                var resp = await fetch('/api/groups', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name }),
                });
                var group;
                if (resp.ok) {
                    group = await resp.json();
                } else if (resp.status === 409) {
                    var all = await (await fetch('/api/groups')).json();
                    group = all.find(function (g) { return g.name === name; });
                } else {
                    alert('Could not create group');
                    return;
                }
                if (!group) return;
                await fetch('/api/movies/' + MOVIE_ID + '/groups/' + group.id, { method: 'POST' });
                groupsLoaded = false;
                loadDetail();
            }

            function renderStars(id, rating) {
                var html = '';
                for (var i = 1; i <= 5; i++) {
                    var filled = i <= rating;
                    html += '<span onclick="setRating(' + id + ',' + i + ')" style="cursor:pointer;font-size:1.3rem;color:' + (filled ? '#f1c40f' : '#b0b8c4') + ';">' + (filled ? '★' : '☆') + '</span>';
                }
                if (rating > 0) {
                    html += ' <span onclick="setRating(' + id + ',0)" style="cursor:pointer;font-size:0.7rem;color:var(--text-muted);margin-left:0.5rem;">clear</span>';
                }
                return html;
            }

            var calYear = null, calMonth = null, calSelectedDay = null;
            var CAL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

            function openCalendar(ev) {
                ev.stopPropagation();
                var now = new Date();
                calYear = now.getFullYear();
                calMonth = now.getMonth();
                calSelectedDay = null;
                var pop = document.createElement('div');
                pop.className = 'popover';
                pop.id = 'cal-popover';
                document.body.appendChild(pop);
                renderCalendar();
                // Position after render so we can measure the popup height
                var rect = ev.target.getBoundingClientRect();
                var popHeight = pop.offsetHeight || 300;
                var top = rect.bottom + 4;
                if (top + popHeight > window.innerHeight) {
                    top = rect.top - popHeight - 4;
                }
                if (top < 4) top = 4;
                var left = Math.max(8, rect.left - 200);
                pop.style.top = top + 'px';
                pop.style.left = left + 'px';
            }

            function renderCalendar() {
                var pop = document.getElementById('cal-popover');
                if (!pop) return;
                var first = new Date(calYear, calMonth, 1);
                var startDay = first.getDay();
                var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
                var monthOpts = '', yearOpts = '';
                for (var m = 0; m < 12; m++) monthOpts += '<option value="' + m + '"' + (m === calMonth ? ' selected' : '') + '>' + CAL_MONTHS[m] + '</option>';
                for (var y = calYear - 20; y <= calYear + 1; y++) yearOpts += '<option value="' + y + '"' + (y === calYear ? ' selected' : '') + '>' + y + '</option>';
                var html = '<div style="display:flex;gap:0.3rem;margin-bottom:0.4rem;">' +
                    '<select onchange="calMonth=parseInt(this.value);renderCalendar()" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:0.2rem;font-size:0.75rem;flex:2;">' + monthOpts + '</select>' +
                    '<select onchange="calYear=parseInt(this.value);renderCalendar()" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:0.2rem;font-size:0.75rem;flex:1;">' + yearOpts + '</select>' +
                    '</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;">';
                var days = ['Su','Mo','Tu','We','Th','Fr','Sa'];
                for (var i = 0; i < 7; i++) html += '<span style="font-size:0.65rem;color:var(--text-muted);">' + days[i] + '</span>';
                for (var j = 0; j < startDay; j++) html += '<span></span>';
                for (var d = 1; d <= daysInMonth; d++) {
                    var isSel = (d === calSelectedDay);
                    html += '<button onclick="calSelectedDay=' + d + ';renderCalendar()" style="' + (isSel ? 'background:var(--accent);color:#fff;' : 'background:none;color:var(--text);') + 'border:none;padding:0.2rem;font-size:0.8rem;cursor:pointer;border-radius:4px;">' + d + '</button>';
                }
                html += '</div><div style="margin-top:0.5rem;">' +
                    '<button onclick="saveCalendar()" style="background:var(--accent);color:#fff;font-size:0.75rem;">Save</button> ' +
                    '<button onclick="unmarkMovie()" style="background:var(--border);color:var(--text);font-size:0.75rem;">Unmark</button> ' +
                    '<button onclick="dismissPopover()" style="background:var(--border);color:var(--text);font-size:0.75rem;">Cancel</button></div>';
                pop.innerHTML = html;
            }

            function dismissPopover() { var p = document.getElementById('cal-popover'); if (p) p.remove(); }

            async function saveCalendar() {
                if (!calSelectedDay) { return; }
                var d = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(calSelectedDay).padStart(2, '0');
                await fetch('/api/movies/' + MOVIE_ID + '/watch?watched=true&watched_at=' + d, {method:'PATCH'});
                dismissPopover();
                loadDetail();
            }

            async function unmarkMovie() {
                await fetch('/api/movies/' + MOVIE_ID + '/watch?watched=false', {method:'PATCH'});
                dismissPopover();
                loadDetail();
            }

            async function toggleWatched(id, watched) { await fetch('/api/movies/' + id + '/watch?watched=' + watched, {method:'PATCH'}); loadDetail(); }
            async function toggleWatchlist(id, w) { await fetch('/api/movies/' + id + '/watchlist?watchlist=' + w, {method:'PATCH'}); loadDetail(); }
            async function toggleHidden(id, h) { await fetch('/api/movies/' + id + '/hidden?hidden=' + h, {method:'PATCH'}); loadDetail(); }
            async function setRating(id, r) { await fetch('/api/movies/' + id + '/rating?rating=' + r, {method:'PATCH'}); loadDetail(); }

            function editNotes(ev) {
                ev.stopPropagation();
                var display = document.getElementById('notes-display');
                var current = display.textContent === 'No notes yet' ? '' : display.textContent;
                display.innerHTML = '<textarea id="notes-ta" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:0.5rem;font-size:0.85rem;resize:vertical;min-height:70px;font-family:inherit;">' + escapeHtml(current) + '</textarea>' +
                    '<div style="margin-top:0.5rem;"><button onclick="saveNotes()" style="background:var(--accent);color:#fff;border:none;padding:0.3rem 0.9rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">Save</button> ' +
                    '<button onclick="loadDetail()" style="background:var(--border);color:var(--text);border:none;padding:0.3rem 0.9rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">Cancel</button></div>';
            }

            async function saveNotes() {
                var ta = document.getElementById('notes-ta');
                await fetch('/api/movies/' + MOVIE_ID + '/notes?notes=' + encodeURIComponent(ta ? ta.value : ''), {method:'PATCH'});
                loadDetail();
            }

            function editImdb(ev) {
                ev.stopPropagation();
                var link = ev.target;
                link.innerHTML = '<input type="text" id="imdb-input" placeholder="tt9059820" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:0.2rem;font-size:0.75rem;width:120px;">';
                var input = document.getElementById('imdb-input');
                input.focus();
                input.addEventListener('keydown', function(e) { if (e.key === 'Enter') saveImdb(); });
            }

            async function saveImdb() {
                var input = document.getElementById('imdb-input');
                await fetch('/api/movies/' + MOVIE_ID + '/imdb?imdb_id=' + encodeURIComponent(input ? input.value.trim() : ''), {method:'PATCH'});
                loadDetail();
            }

            function onLocaleSelect() {
                loadDetail();
            }
            document.getElementById('locale-toggle').textContent = TVTracI18n.currentFlag();
            document.getElementById('locale-toggle').title = TVTracI18n.currentLabel();

            loadDetail();
        </script>
    </body>
</html>
