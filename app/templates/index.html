<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TV-Trac</title>
        <script src="/static/app.js"></script>
        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e94560' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='7' width='20' height='14' rx='2'/%3E%3Cpolyline points='17 2 12 7 7 2'/%3E%3C/svg%3E"
        />
        <style>
            :root {
                --bg: #f4f6f9;
                --surface: #ffffff;
                --accent: #e94560;
                --text: #1a1a2e;
                --text-muted: #6b7280;
                --border: #e0e4e8;
                --content-max-width: 960px;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.6;
            }
            header {
                background: var(--surface);
                padding: 1.5rem 2rem;
                border-bottom: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            header h1 {
                font-size: 1.5rem;
                color: var(--accent);
            }
            nav {
                display: flex;
                gap: 0;
                border-bottom: 1px solid var(--border);
                margin-bottom: 1rem;
            }
            nav a {
                color: var(--text-muted);
                text-decoration: none;
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
                border-bottom: 2px solid transparent;
                cursor: pointer;
            }
            nav a.active {
                color: var(--accent);
                border-bottom-color: var(--accent);
            }
            main {
                max-width: var(--content-max-width);
                margin: 2rem auto;
                padding: 0 1rem;
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1.5rem;
                margin-bottom: 1rem;
            }
            .badge {
                display: inline-block;
                padding: 0.15rem 0.6rem;
                border-radius: 12px;
                font-size: 0.75rem;
                font-weight: 600;
            }
            .badge-watched {
                background: #2ecc71;
                color: #fff;
            }
            .badge-unwatched {
                background: var(--border);
                color: var(--text-muted);
            }
            .badge-partial {
                background: #f39c12;
                color: #fff;
            }
            button {
                background: var(--accent);
                color: #fff;
                border: none;
                padding: 0.5rem 1.2rem;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.9rem;
            }
            button:hover {
                opacity: 0.85;
            }
            .filter-bar {
                display: flex;
                gap: 0.5rem;
                align-items: center;
                margin-bottom: 1rem;
                flex-wrap: wrap;
            }
            .search-wrapper {
                position: relative;
                flex: 1;
                min-width: 180px;
            }
            .search-wrapper input {
                width: 100%;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--text);
                padding: 0.5rem 2rem 0.5rem 0.8rem;
                font-size: 0.9rem;
            }
            .search-wrapper input::placeholder {
                color: var(--text-muted);
            }
            .search-clear {
                position: absolute;
                right: 6px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: var(--text-muted);
                cursor: pointer;
                font-size: 1rem;
                padding: 2px 4px;
                display: none;
            }
            .search-clear:hover {
                color: var(--text);
            }
            .filter-btn {
                background: var(--surface);
                color: var(--text-muted);
                border: 1px solid var(--border);
                padding: 0.4rem 1rem;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.8rem;
                white-space: nowrap;
            }
            .filter-btn.active {
                background: var(--surface);
                color: var(--accent);
                border-color: var(--accent);
                font-weight: 700;
            }
            .filter-count {
                display: inline-block;
                min-width: 1.1rem;
                text-align: center;
                background: var(--border);
                color: var(--text-muted);
                border-radius: 10px;
                padding: 0 0.35rem;
                font-size: 0.7rem;
                margin-left: 0.3rem;
                font-weight: 600;
            }
            .filter-btn.active .filter-count {
                background: var(--accent);
                color: #fff;
            }
            .page-nav {
                display: flex;
                gap: 0.25rem;
                align-items: center;
                justify-content: center;
                margin-top: 1rem;
                flex-wrap: wrap;
            }
            .page-nav button {
                background: var(--surface);
                color: var(--text-muted);
                border: 1px solid var(--border);
                padding: 0.3rem 0.6rem;
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.75rem;
            }
            .page-nav button.active {
                background: var(--accent);
                color: #fff;
                border-color: var(--accent);
            }
            .page-nav button:disabled {
                opacity: 0.3;
                cursor: default;
            }
            .page-nav select {
                background: var(--surface);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 4px;
                padding: 0.3rem;
                font-size: 0.75rem;
                margin-left: 0.5rem;
            }
            .grid-view {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }
            .grid-item {
                cursor: pointer;
                text-align: center;
                transition: transform 0.1s;
            }
            .grid-item:hover {
                transform: scale(1.03);
            }
            .grid-item .grid-poster {
                width: 100%;
                aspect-ratio: 2/3;
                object-fit: cover;
                border-radius: 8px;
                background: var(--border);
            }
            .grid-item .grid-title {
                font-size: 0.8rem;
                margin-top: 0.4rem;
                line-height: 1.3;
            }
            .episode-list {
                list-style: none;
                margin-top: 0.5rem;
            }
            .episode-list li {
                padding: 0.4rem 0;
                border-bottom: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .episode-list li:last-child {
                border-bottom: none;
            }
            .loading {
                color: var(--text-muted);
                font-style: italic;
            }
            .error {
                color: var(--accent);
                white-space: pre-wrap;
                font-size: 0.85rem;
            }
            .info-icon {
                display: inline-block;
                width: 16px;
                height: 16px;
                line-height: 16px;
                text-align: center;
                border-radius: 50%;
                background: var(--border);
                color: var(--text-muted);
                font-size: 10px;
                font-weight: bold;
                cursor: pointer;
                margin: 0 0.3rem;
                vertical-align: middle;
                user-select: none;
            }
            .info-icon:hover {
                background: var(--accent);
                color: #fff;
            }
            .notes-icon {
                display: inline-block;
                width: 18px;
                height: 18px;
                line-height: 18px;
                text-align: center;
                border: 1px solid var(--text-muted);
                border-radius: 3px;
                color: var(--text-muted);
                cursor: pointer;
                font-size: 10px;
                font-weight: bold;
                margin: 0 0.3rem;
                vertical-align: middle;
                user-select: none;
            }
            .notes-icon.has-notes {
                background: #f1c40f;
                border-color: #f1c40f;
                color: #000;
            }
            .thumb {
                width: 40px;
                height: 56px;
                object-fit: cover;
                border-radius: 4px;
                margin-right: 0.75rem;
                flex-shrink: 0;
                background: var(--border);
            }
            .ext-link {
                color: var(--text-muted);
                text-decoration: none;
                font-size: 0.7rem;
                margin-left: 0.3rem;
            }
            .ext-link:hover {
                color: var(--accent);
            }
            .card-title {
                display: flex;
                align-items: flex-start;
            }
            .card-title-text {
                flex: 1;
            }
            .notes-editor {
                margin-top: 0.5rem;
            }
            .notes-editor textarea {
                width: 100%;
                background: var(--bg);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 0.5rem;
                font-size: 0.8rem;
                resize: vertical;
                min-height: 60px;
                font-family: inherit;
            }
            .notes-editor button {
                margin-top: 0.3rem;
                font-size: 0.75rem;
                padding: 0.25rem 0.8rem;
            }
            .popover {
                position: fixed;
                z-index: 1000;
                background: var(--surface);
                border: 1px solid var(--accent);
                border-radius: 8px;
                padding: 0.75rem 1rem;
                max-width: 380px;
                font-size: 0.85rem;
                color: var(--text);
                line-height: 1.5;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            }
            footer {
                text-align: center;
                padding: 1.5rem;
                color: var(--text-muted);
                font-size: 0.7rem;
            }
            footer img {
                height: 20px;
                vertical-align: middle;
                margin: 0 0.5rem;
            }
            footer a {
                color: var(--text-muted);
                text-decoration: none;
            }
            footer a:hover {
                color: var(--text);
            }
        </style>
    </head>
    <body>
        <header>
            <div>
                <div style="display: flex; align-items: center; gap: 0.5rem">
                    <svg
                        width="28"
                        height="28"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="#e94560"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <rect x="2" y="7" width="20" height="14" rx="2" />
                        <polyline points="17 2 12 7 7 2" />
                    </svg>
                    <h1><a href="/" style="color: inherit; text-decoration: none">TV-Trac</a></h1>
                </div>
                <p
                    style="
                        color: var(--text-muted);
                        font-size: 0.75rem;
                        margin-top: 0.1rem;
                    "
                >
                    Track your TV shows &amp; movies
                </p>
            </div>
            <div style="display: flex; align-items: center; gap: 0.5rem">
                <span
                    id="media-label"
                    style="color: var(--text-muted); font-size: 0.85rem"
                    >TV: {{ media_tv }}</span
                >
                <button
                    id="locale-toggle"
                    onclick="TVTracI18n.openPicker(this, onLocaleSelect, event)"
                    title="Change date/time format"
                    style="
                        background: transparent;
                        border: none;
                        height: 2.1rem;
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                        padding: 0 0.5rem;
                        font-size: 1rem;
                        cursor: pointer;
                        line-height: 1;
                    "
                >🏳️</button>
                <button
                    id="width-toggle"
                    onclick="TVTracWidth.cycle(this)"
                    title="Width: 960px"
                    style="
                        background: #e0e4e8;
                        border: none;
                        color: var(--text);
                        height: 2.1rem;
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                        padding: 0 0.8rem;
                        border-radius: 6px;
                        font-size: 0.85rem;
                        cursor: pointer;
                        line-height: 1;
                    "
                >← 960px →</button>
                <button
                    id="scan-btn"
                    onclick="scanMedia()"
                    style="
                        background: var(--accent);
                        color: #fff;
                        border: none;
                        height: 2.1rem;
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                        padding: 0 0.8rem;
                        border-radius: 6px;
                        font-size: 0.85rem;
                        cursor: pointer;
                        line-height: 1;
                    "
                >
                    🔍 Scan
                </button>
                <button
                    onclick="checkMissing()"
                    style="
                        background: var(--surface);
                        color: var(--text);
                        border: 1px solid var(--border);
                        height: 2.1rem;
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                        padding: 0 0.8rem;
                        border-radius: 6px;
                        font-size: 0.85rem;
                        cursor: pointer;
                        line-height: 1;
                    "
                >
                    ⚠️ Check Missing
                </button>
            </div>
        </header>
        <nav>
            <a class="active" onclick="showPage('shows', this)">📺 Shows</a>
            <a onclick="showPage('movies', this)">🎬 Movies</a>
            <a href="/recent-episodes">🕒 Recent Episodes</a>
        </nav>
        <main>
            <!-- SHOWS PAGE -->
            <div id="page-shows">
                <div
                    class="filter-bar"
                    id="shows-filter-bar"
                    style="display: none"
                >
                    <div class="search-wrapper">
                        <input
                            type="text"
                            id="shows-search"
                            placeholder="Search shows..."
                            oninput="applyShowFilters()"
                        />
                        <button
                            class="search-clear"
                            id="shows-search-clear"
                            onclick="clearShowSearch()"
                        >
                            ✕
                        </button>
                    </div>
                    <button
                        class="filter-btn active"
                        data-filter="all"
                        onclick="setShowFilter('all', this)"
                    >
                        All <span class="filter-count"></span>
                    </button>
                    <button
                        class="filter-btn"
                        data-filter="watched"
                        onclick="setShowFilter('watched', this)"
                    >
                        ✓ Watched <span class="filter-count"></span>
                    </button>
                    <button
                        class="filter-btn"
                        data-filter="partial"
                        onclick="setShowFilter('partial', this)"
                    >
                        ◐ Partial <span class="filter-count"></span>
                    </button>
                    <button
                        class="filter-btn"
                        data-filter="unwatched"
                        onclick="setShowFilter('unwatched', this)"
                    >
                        ○ Unwatched <span class="filter-count"></span>
                    </button>
                    <button
                        class="filter-btn"
                        data-filter="hidden"
                        onclick="setShowFilter('hidden', this)"
                    >
                        ⊘ Hidden <span class="filter-count"></span>
                    </button>
                    <button
                        class="filter-btn"
                        data-filter="watchlist"
                        onclick="setShowFilter('watchlist', this)"
                    >
                        ★ Watchlist <span class="filter-count"></span>
                    </button>
                    <button
                        class="filter-btn"
                        data-filter="ended"
                        onclick="setShowFilter('ended', this)"
                    >
                        ◼ Ended <span class="filter-count"></span>
                    </button>
                    <button
                        class="filter-btn"
                        data-filter="continuing"
                        onclick="setShowFilter('continuing', this)"
                    >
                        ▶ Continuing <span class="filter-count"></span>
                    </button>
                    <select
                        id="shows-sort"
                        onchange="applyShowFilters()"
                        style="
                            background: var(--surface);
                            color: var(--text);
                            border: 1px solid var(--border);
                            border-radius: 6px;
                            padding: 0.4rem 0.6rem;
                            font-size: 0.8rem;
                            margin-left: auto;
                        "
                    >
                        <option value="alpha">A-Z</option>
                        <option value="zalpha">Z-A</option>
                        <option value="recent">Recently Added</option>
                        <option value="aired-desc">First Aired: Newest</option>
                        <option value="aired-asc">First Aired: Oldest</option>
                        <option value="rating-desc">Rating: High to Low</option>
                        <option value="rating-asc">Rating: Low to High</option>
                    </select>
                    <select
                        id="shows-date-filter"
                        onchange="applyShowFilters()"
                        style="
                            background: var(--surface);
                            color: var(--text);
                            border: 1px solid var(--border);
                            border-radius: 6px;
                            padding: 0.4rem 0.6rem;
                            font-size: 0.8rem;
                        "
                    >
                        <option value="" disabled selected>
                            New Content Filter
                        </option>
                        <option value="all">All Time</option>
                        <option value="1">Added in last day</option>
                        <option value="3">Added in last 3 days</option>
                        <option value="7">Added in last 7 days</option>
                        <option value="30">Added in last 30 days</option>
                    </select>
                    <select
                        id="shows-aired-filter"
                        onchange="applyShowFilters()"
                        style="
                            background: var(--surface);
                            color: var(--text);
                            border: 1px solid var(--border);
                            border-radius: 6px;
                            padding: 0.4rem 0.6rem;
                            font-size: 0.8rem;
                        "
                    >
                        <option value="" disabled selected>
                            First Aired Filter
                        </option>
                        <option value="all">All Time</option>
                        <option value="upcoming">Upcoming</option>
                        <option value="month">Last month</option>
                        <option value="6months">Last six months</option>
                        <option value="1">Premiered in last year</option>
                        <option value="3">Premiered in last 3 years</option>
                        <option value="5">Premiered in last 5 years</option>
                        <option value="10">Premiered in last 10 years</option>
                        <option value="older">Premiered over 10 years ago</option>
                    </select>
                    <select
                        id="shows-rating-filter"
                        onchange="applyShowFilters()"
                        style="
                            background: var(--surface);
                            color: var(--text);
                            border: 1px solid var(--border);
                            border-radius: 6px;
                            padding: 0.4rem 0.6rem;
                            font-size: 0.8rem;
                        "
                    >
                        <option value="0">Any rating</option>
                        <option value="1">1 ★</option>
                        <option value="2">2 ★</option>
                        <option value="3">3 ★</option>
                        <option value="4">4 ★</option>
                        <option value="5">5 ★</option>
                    </select>
                    <button class="filter-btn" onclick="clearAllFilters()">
                        ✕ Clear All
                    </button>
                    <button
                        class="filter-btn"
                        onclick="toggleShowView()"
                        id="show-view-toggle"
                    >
                        ☰ List
                    </button>
                </div>
                <div class="card">
                    <h2>
                        <span id="shows-title-text">Your Shows</span>
                        <span id="shows-scanning" style="display:none">Scanning shows and movies…</span>
                        <span
                            id="show-count"
                            style="color: var(--text-muted); font-size: 0.85rem"
                        ></span>
                    </h2>
                    <div id="shows-list" class="loading">Loading shows...</div>
                    <div id="shows-pagination" class="page-nav"></div>
                </div>
            </div>

            <!-- MOVIES PAGE -->
            <div id="page-movies" style="display: none">
                <div
                    class="filter-bar"
                    id="movies-filter-bar"
                    style="display: none"
                >
                    <div class="search-wrapper">
                        <input
                            type="text"
                            id="movies-search"
                            placeholder="Search movies..."
                            oninput="applyMovieFilters()"
                        />
                        <button
                            class="search-clear"
                            id="movies-search-clear"
                            onclick="clearMovieSearch()"
                        >
                            ✕
                        </button>
                    </div>
                    <button
                        class="filter-btn active"
                        data-filter="all"
                        onclick="setMovieFilter('all', this)"
                    >
                        All <span class="filter-count"></span>
                    </button>
                    <button
                        class="filter-btn"
                        data-filter="watched"
                        onclick="setMovieFilter('watched', this)"
                    >
                        ✓ Watched <span class="filter-count"></span>
                    </button>
                    <button
                        class="filter-btn"
                        data-filter="unwatched"
                        onclick="setMovieFilter('unwatched', this)"
                    >
                        ○ Unwatched <span class="filter-count"></span>
                    </button>
                    <button
                        class="filter-btn"
                        data-filter="watchlist"
                        onclick="setMovieFilter('watchlist', this)"
                    >
                        ★ Watchlist <span class="filter-count"></span>
                    </button>
                    <select
                        id="movies-sort"
                        onchange="applyMovieFilters()"
                        style="
                            background: var(--surface);
                            color: var(--text);
                            border: 1px solid var(--border);
                            border-radius: 6px;
                            padding: 0.4rem 0.6rem;
                            font-size: 0.8rem;
                            margin-left: auto;
                        "
                    >
                        <option value="alpha">A-Z</option>
                        <option value="zalpha">Z-A</option>
                        <option value="recent">Recently Added</option>
                        <option value="aired-desc">First Aired: Newest</option>
                        <option value="aired-asc">First Aired: Oldest</option>
                        <option value="rating-desc">Rating: High to Low</option>
                        <option value="rating-asc">Rating: Low to High</option>
                    </select>
                    <select
                        id="movies-aired-filter"
                        onchange="applyMovieFilters()"
                        style="
                            background: var(--surface);
                            color: var(--text);
                            border: 1px solid var(--border);
                            border-radius: 6px;
                            padding: 0.4rem 0.6rem;
                            font-size: 0.8rem;
                        "
                    >
                        <option value="" disabled selected>
                            Release Date Filter
                        </option>
                        <option value="all">All Time</option>
                        <option value="upcoming">Upcoming</option>
                        <option value="month">Last month</option>
                        <option value="6months">Last six months</option>
                        <option value="1">Released in last year</option>
                        <option value="3">Released in last 3 years</option>
                        <option value="5">Released in last 5 years</option>
                        <option value="10">Released in last 10 years</option>
                        <option value="older">Released over 10 years ago</option>
                    </select>
                    <select
                        id="movies-rating-filter"
                        onchange="applyMovieFilters()"
                        style="
                            background: var(--surface);
                            color: var(--text);
                            border: 1px solid var(--border);
                            border-radius: 6px;
                            padding: 0.4rem 0.6rem;
                            font-size: 0.8rem;
                        "
                    >
                        <option value="0">Any rating</option>
                        <option value="1">1 ★</option>
                        <option value="2">2 ★</option>
                        <option value="3">3 ★</option>
                        <option value="4">4 ★</option>
                        <option value="5">5 ★</option>
                    </select>
                    <button class="filter-btn" onclick="clearAllMovieFilters()">
                        ✕ Clear All
                    </button>
                    <button
                        class="filter-btn"
                        onclick="toggleMovieView()"
                        id="movie-view-toggle"
                    >
                        ☰ List
                    </button>
                </div>
                <div class="card">
                    <h2>
                        Your Movies
                        <span
                            id="movie-count"
                            style="color: var(--text-muted); font-size: 0.85rem"
                        ></span>
                    </h2>
                    <div id="movies-list" class="loading">
                        Loading movies...
                    </div>
                    <div id="movies-pagination" class="page-nav"></div>
                </div>
            </div>
        </main>

        <footer>
            <span>
                TV data provided by
                <a href="https://thetvdb.com" target="_blank">TheTVDB</a>. Movie
                data provided by
                <a href="https://www.themoviedb.org" target="_blank">TMDB</a>.
            </span>
        </footer>

        <script>
            // ── Navigation ─────────────────────────────────────────────────
            function showPage(page, link) {
                document.querySelectorAll("nav a").forEach(function (a) {
                    a.classList.remove("active");
                });
                link.classList.add("active");
                document.getElementById("page-shows").style.display =
                    page === "shows" ? "block" : "none";
                document.getElementById("page-movies").style.display =
                    page === "movies" ? "block" : "none";
                document.getElementById("media-label").textContent =
                    page === "movies"
                        ? "Movies: /media/movies"
                        : "TV: /media/tv";
                if (page === "movies" && allMovies.length === 0) fetchMovies();
            }

            // ── API ────────────────────────────────────────────────────────
            var SHOWS_API = "/api/shows";
            var MOVIES_API = "/api/movies";
            var allShows = [],
                allMovies = [];

            async function apiFetch(url, opts) {
                var resp = await fetch(url, opts);
                if (!resp.ok) {
                    var body = await resp.json().catch(function () {
                        return null;
                    });
                    var err = new Error("HTTP " + resp.status);
                    err.body = body;
                    throw err;
                }
                return resp.json();
            }

            // ── Popover ────────────────────────────────────────────────────
            var activePopover = null;
            function dismissPopover() {
                if (activePopover) {
                    activePopover.remove();
                    activePopover = null;
                }
            }
            document.addEventListener(
                "click",
                function (e) {
                    if (e.target.classList.contains("info-icon")) {
                        e.stopPropagation();
                        e.preventDefault();
                        if (activePopover) {
                            dismissPopover();
                            return;
                        }
                        var overview = e.target.getAttribute("data-overview");
                        if (!overview) return;
                        var pop = document.createElement("div");
                        pop.className = "popover";
                        pop.textContent = overview;
                        document.body.appendChild(pop);
                        var rect = e.target.getBoundingClientRect();
                        var top = rect.bottom + 4,
                            left = Math.max(8, rect.left - 180);
                        if (top + 120 > window.innerHeight)
                            top = rect.top - 130;
                        pop.style.top = top + "px";
                        pop.style.left = left + "px";
                        activePopover = pop;
                        return;
                    }
                    if (activePopover) dismissPopover();
                },
                true,
            );

            // ── Helpers ────────────────────────────────────────────────────
            function escapeHtml(s) {
                var d = document.createElement("div");
                d.textContent = s;
                return d.innerHTML;
            }
            function infoIcon(overview) {
                if (!overview) return "";
                return (
                    '<span class="info-icon" data-overview="' +
                    escapeHtml(overview).replace(/"/g, "&quot;") +
                    '" title="Overview">i</span>'
                );
            }
            function watchBadgeClass(s) {
                if (s === "watched") return "badge-watched";
                if (s === "partial") return "badge-partial";
                return "badge-unwatched";
            }
            function watchBadgeLabel(s) {
                if (s === "watched") return "watched";
                if (s === "partial") return "part watched";
                return "unwatched";
            }
            function compareFirstAired(a, b) {
                var da = a.first_aired || "",
                    db = b.first_aired || "";
                if (!da && !db) return 0;
                if (!da) return 1;
                if (!db) return -1;
                return da.localeCompare(db);
            }
            function airedMatches(dateStr, filterVal) {
                if (!filterVal || filterVal === "all") return true;
                if (!dateStr) return false;
                var p = dateStr.split("-");
                if (p.length !== 3) return false;
                var y = parseInt(p[0]),
                    m = parseInt(p[1]),
                    d = parseInt(p[2]);
                if (isNaN(y) || isNaN(m) || isNaN(d)) return false;
                var aired = new Date(Date.UTC(y, m - 1, d));
                var now = new Date();

                // Shows/movies with a first-aired/release date still in the future.
                if (filterVal === "upcoming") {
                    return aired.getTime() > now.getTime();
                }

                var days =
                    (now.getTime() - aired.getTime()) /
                    (1000 * 60 * 60 * 24);
                if (filterVal === "month") return days >= 0 && days <= 31;
                if (filterVal === "6months") return days >= 0 && days <= 183;

                var years = days / 365.25;
                if (filterVal === "older") return years > 10;
                var maxYears = parseInt(filterVal);
                return years >= 0 && years <= maxYears;
            }

            // ── Notes ──────────────────────────────────────────────────────
            function toggleNotes(id, iconEl, ev, api) {
                ev.stopPropagation();
                var card = iconEl.closest(".card");
                var existing = card.querySelector(".notes-editor");
                if (existing) {
                    existing.remove();
                    return;
                }
                var editor = document.createElement("div");
                editor.className = "notes-editor";
                editor.innerHTML =
                    '<textarea id="notes-ta-' +
                    id +
                    '" placeholder="Add notes...">' +
                    escapeHtml(
                        iconEl.title !== "Add notes" ? iconEl.title : "",
                    ) +
                    '</textarea><button onclick="saveNotes(' +
                    id +
                    ",this,'" +
                    api +
                    '\')">Save</button> <button onclick="this.parentElement.remove()" style="background:var(--border)">Cancel</button>';
                card.appendChild(editor);
                document.getElementById("notes-ta-" + id).focus();
            }
            async function saveNotes(id, btn, api) {
                var ta = document.getElementById("notes-ta-" + id);
                var notes = ta ? ta.value : "";
                await apiFetch(
                    api +
                        "/" +
                        id +
                        "/notes?notes=" +
                        encodeURIComponent(notes),
                    { method: "PATCH" },
                );
                var icon = document.querySelector(
                    '.card[data-show-id="' +
                        id +
                        '"] .notes-icon, .card[data-movie-id="' +
                        id +
                        '"] .notes-icon',
                );
                if (icon) {
                    icon.className =
                        "notes-icon" + (notes.trim() ? " has-notes" : "");
                    icon.title = notes.trim() ? notes : "Add notes";
                }
                btn.parentElement.remove();
            }

            // ── SHOWS ──────────────────────────────────────────────────────
            var showFilter = "all",
                showSearch = "",
                showCurrentPage = 1,
                showPerPage = 10,
                showViewMode = "grid";

            function saveShowState() {
                try {
                    localStorage.setItem(
                        "tvtrac_show_state",
                        JSON.stringify({
                            filter: showFilter,
                            search: showSearch,
                            page: showCurrentPage,
                            perPage: showPerPage,
                            view: showViewMode,
                        }),
                    );
                } catch (e) {}
            }

            function loadShowState() {
                try {
                    var s = JSON.parse(
                        localStorage.getItem("tvtrac_show_state") || "null",
                    );
                    if (!s) return;
                    showFilter = s.filter || "all";
                    showSearch = s.search || "";
                    showCurrentPage = s.page || 1;
                    showPerPage = s.perPage || 10;
                    showViewMode = s.view || "grid";
                } catch (e) {}
            }

            function setShowFilter(f, btn) {
                showFilter = f;
                document
                    .querySelectorAll("#page-shows .filter-btn")
                    .forEach(function (b) {
                        b.classList.remove("active");
                    });
                btn.classList.add("active");
                applyShowFilters();
            }
            function clearAllFilters() {
                showFilter = "all";
                showSearch = "";
                showCurrentPage = 1;
                document.getElementById("shows-search").value = "";
                document.getElementById("shows-sort").value = "alpha";
                document.getElementById("shows-date-filter").value = "";
                document.getElementById("shows-aired-filter").value = "";
                document.getElementById("shows-rating-filter").value = "0";
                // Reset active filter button to All
                document
                    .querySelectorAll("#page-shows .filter-btn")
                    .forEach(function (b) {
                        b.classList.remove("active");
                        if (b.getAttribute("data-filter") === "all") {
                            b.classList.add("active");
                        }
                    });
                applyShowFilters();
            }
            function clearShowSearch() {
                document.getElementById("shows-search").value = "";
                applyShowFilters();
                document.getElementById("shows-search").focus();
            }
            function restoreShowsHeader() {
                var t = document.getElementById("shows-title-text");
                var s = document.getElementById("shows-scanning");
                var c = document.getElementById("show-count");
                if (t) t.style.display = "";
                if (s) s.style.display = "none";
                if (c) c.style.display = "";
            }
            function updateShowFilterCounts() {
                var counts = {
                    all: allShows.filter(function (s) {
                        return s.hidden !== true;
                    }).length,
                    watched: allShows.filter(function (s) {
                        return s.part_watched === "watched";
                    }).length,
                    partial: allShows.filter(function (s) {
                        return s.part_watched === "partial";
                    }).length,
                    unwatched: allShows.filter(function (s) {
                        return s.part_watched === "unwatched";
                    }).length,
                    hidden: allShows.filter(function (s) {
                        return s.hidden === true;
                    }).length,
                    watchlist: allShows.filter(function (s) {
                        return s.watchlist === true;
                    }).length,
                    ended: allShows.filter(function (s) {
                        return s.ended === true;
                    }).length,
                    continuing: allShows.filter(function (s) {
                        return s.ended !== true;
                    }).length,
                };
                document
                    .querySelectorAll("#page-shows .filter-btn")
                    .forEach(function (b) {
                        var key = b.getAttribute("data-filter");
                        var span = b.querySelector(".filter-count");
                        if (span && counts[key] !== undefined) {
                            span.textContent = counts[key];
                        }
                    });
            }
            function applyShowFilters() {
                restoreShowsHeader();
                updateShowFilterCounts();
                showSearch = document
                    .getElementById("shows-search")
                    .value.toLowerCase();
                document.getElementById("shows-search-clear").style.display =
                    showSearch ? "block" : "none";
                var filtered = allShows;
                if (showSearch)
                    filtered = filtered.filter(function (s) {
                        return s.title.toLowerCase().indexOf(showSearch) !== -1;
                    });
                if (showFilter === "watched")
                    filtered = filtered.filter(function (s) {
                        return s.part_watched === "watched";
                    });
                else if (showFilter === "partial")
                    filtered = filtered.filter(function (s) {
                        return s.part_watched === "partial";
                    });
                else if (showFilter === "unwatched")
                    filtered = filtered.filter(function (s) {
                        return s.part_watched === "unwatched";
                    });
                else if (showFilter === "hidden")
                    filtered = filtered.filter(function (s) {
                        return s.hidden === true;
                    });
                else if (showFilter === "watchlist")
                    filtered = filtered.filter(function (s) {
                        return s.watchlist === true;
                    });
                else if (showFilter === "ended")
                    filtered = filtered.filter(function (s) {
                        return s.ended === true;
                    });
                else if (showFilter === "continuing")
                    filtered = filtered.filter(function (s) {
                        return s.ended !== true;
                    });
                else if (!showSearch)
                    // Default: exclude hidden, unless searching (then surface them)
                    filtered = filtered.filter(function (s) {
                        return s.hidden !== true;
                    });
                // Date range filter (empty placeholder or "all" = no filter)
                var dateFilter =
                    document.getElementById("shows-date-filter").value;
                if (dateFilter && dateFilter !== "all") {
                    var days = parseInt(dateFilter);
                    var cutoff = new Date();
                    cutoff.setDate(cutoff.getDate() - days);
                    filtered = filtered.filter(function (s) {
                        var d = new Date(s.updated_at);
                        return d >= cutoff;
                    });
                }
                // First-aired filter (actual premiere date, not scan date)
                var airedFilter =
                    document.getElementById("shows-aired-filter").value;
                filtered = filtered.filter(function (s) {
                    return airedMatches(s.first_aired, airedFilter);
                });
                // Rating filter
                var ratingFilter = parseInt(
                    document.getElementById("shows-rating-filter").value,
                );
                if (ratingFilter > 0) {
                    filtered = filtered.filter(function (s) {
                        return s.rating === ratingFilter;
                    });
                }
                // Compute counts: total / visible / hidden
                var totalShows = allShows.length;
                var visibleShows = allShows.filter(function (s) {
                    return s.hidden !== true;
                }).length;
                var hiddenShows = totalShows - visibleShows;
                var endedShows = allShows.filter(function (s) {
                    return s.ended === true;
                }).length;
                var continuingShows = totalShows - endedShows;

                // Search-matched subset (before status/hidden filtering)
                var searchMatches = allShows;
                if (showSearch) {
                    searchMatches = searchMatches.filter(function (s) {
                        return s.title.toLowerCase().indexOf(showSearch) !== -1;
                    });
                }
                var searchVisible = searchMatches.filter(function (s) {
                    return s.hidden !== true;
                }).length;
                var searchHidden = searchMatches.length - searchVisible;
                var searchEnded = searchMatches.filter(function (s) {
                    return s.ended === true;
                }).length;
                var searchContinuing = searchMatches.length - searchEnded;

                var sort = document.getElementById("shows-sort").value;
                if (airedFilter && airedFilter !== "all" && sort === "alpha") {
                    if (airedFilter === "upcoming") {
                        filtered = filtered.slice().sort(compareFirstAired);
                    } else {
                        filtered = filtered.slice().sort(function (a, b) {
                            return -compareFirstAired(a, b);
                        });
                    }
                } else if (sort === "recent")
                    filtered = filtered.slice().sort(function (a, b) {
                        return new Date(b.updated_at) - new Date(a.updated_at);
                    });
                else if (sort === "aired-desc")
                    filtered = filtered.slice().sort(function (a, b) {
                        return -compareFirstAired(a, b);
                    });
                else if (sort === "aired-asc")
                    filtered = filtered.slice().sort(compareFirstAired);
                else if (sort === "zalpha")
                    filtered = filtered.slice().sort(function (a, b) {
                        return b.title.localeCompare(a.title);
                    });
                else if (sort === "rating-desc")
                    filtered = filtered.slice().sort(function (a, b) {
                        return b.rating - a.rating;
                    });
                else if (sort === "rating-asc")
                    filtered = filtered.slice().sort(function (a, b) {
                        return a.rating - b.rating;
                    });
                if (showSearch) {
                    document.getElementById("show-count").innerHTML =
                        "Found: <strong>" +
                        searchMatches.length +
                        "</strong> · " +
                        "Visible: " +
                        searchVisible +
                        " · " +
                        "Hidden: " +
                        searchHidden +
                        " · " +
                        "Ended: " +
                        searchEnded +
                        " · " +
                        "Continuing: " +
                        searchContinuing;
                } else {
                    document.getElementById("show-count").innerHTML =
                        "Total: <strong>" +
                        totalShows +
                        "</strong> · " +
                        "Visible: " +
                        visibleShows +
                        " · " +
                        "Hidden: " +
                        hiddenShows +
                        " · " +
                        "Ended: " +
                        endedShows +
                        " · " +
                        "Continuing: " +
                        continuingShows;
                }
                // Paginate
                showCurrentPage = Math.min(
                    showCurrentPage,
                    Math.ceil(filtered.length / showPerPage) || 1,
                );
                var start = (showCurrentPage - 1) * showPerPage;
                var paged = filtered.slice(start, start + showPerPage);
                var listEl = document.getElementById("shows-list");
                listEl.className = showViewMode === "grid" ? "grid-view" : "";
                listEl.innerHTML =
                    showViewMode === "grid"
                        ? renderShowGrid(paged)
                        : renderShowList(paged);
                renderPagination(
                    "shows",
                    filtered.length,
                    showCurrentPage,
                    showPerPage,
                );
                saveShowState();
            }
            function showStatsHtml(s, compact) {
                var size = compact ? "0.65" : "0.75";
                var html =
                    '<span style="color:var(--text-muted);font-size:' +
                    size +
                    'rem;">📺 ' +
                    s.season_count +
                    " seasons · " +
                    s.watched_season_count +
                    " watched";
                if (s.missing_season_count > 0)
                    html +=
                        ' · <span style="color:var(--accent);">' +
                        s.missing_season_count +
                        " missing</span>";
                html +=
                    " &nbsp;•&nbsp; 🎞 " +
                    s.episode_count +
                    " eps · " +
                    s.watched_episode_count +
                    " watched";
                if (s.missing_count > 0)
                    html +=
                        ' · <span style="color:var(--accent);" title="' +
                        escapeHtml(s.missing_details || "") +
                        '">' +
                        s.missing_count +
                        " missing</span>";
                return html + "</span>";
            }
            function renderShowList(shows) {
                return shows
                    .map(function (s) {
                        return (
                            '<div class="card" data-show-id="' +
                            s.id +
                            '" style="cursor:pointer" onclick="window.location.href=\'/show/' +
                            s.id +
                            "'\">" +
                            '<div class="card-title">' +
                            (s.poster_path
                                ? '<img class="thumb" src="' +
                                  s.poster_path +
                                  '" onerror="this.style.display=\'none\'">'
                                : "") +
                            '<div class="card-title-text">' +
                            "<strong>" +
                            escapeHtml(s.title) +
                            (s.first_aired &&
                            s.title.indexOf(s.first_aired.substring(0, 4)) ===
                                -1
                                ? " (" + s.first_aired.substring(0, 4) + ")"
                                : "") +
                            "</strong>" +
                            (s.watchlist
                                ? ' <span style="background:#f1c40f;color:#000;font-size:0.6rem;padding:0 0.3rem;border-radius:3px;font-weight:bold;vertical-align:middle;" title="On Watchlist">WL</span>'
                                : "") +
                            (s.hidden
                                ? ' <span style="background:#e0e4e8;color:#5b6472;font-size:0.6rem;padding:0 0.3rem;border-radius:3px;font-weight:bold;vertical-align:middle;" title="Hidden from listings">hidden</span>'
                                : "") +
                            (s.ended
                                ? ' <span style="background:#e8edf5;color:#4a5a72;font-size:0.6rem;padding:0 0.3rem;border-radius:3px;font-weight:bold;vertical-align:middle;" title="Marked as ended — no more seasons/episodes">ended</span>'
                                : "") +
                            (s.first_aired
                                ? ' <span style="color:var(--text-muted);font-size:0.8rem;">' +
                                  formatDateLong(s.first_aired) +
                                  "</span>"
                                : "") +
                            (s.created_at
                                ? ' <span style="color:var(--text-muted);font-size:0.75rem;">· added ' +
                                  formatDateLong(s.created_at.substring(0, 10)) +
                                  "</span>"
                                : "") +
                            infoIcon(s.overview) +
                            '<span class="notes-icon' +
                            (s.notes ? " has-notes" : "") +
                            '" onclick="event.stopPropagation();toggleNotes(' +
                            s.id +
                            ",this,event,'" +
                            SHOWS_API +
                            '\')" title="' +
                            (s.notes ? escapeHtml(s.notes) : "Add notes") +
                            '">N</span>' +
                            '<span class="badge ' +
                            watchBadgeClass(s.part_watched) +
                            '" style="margin-left:0.5rem;">' +
                            watchBadgeLabel(s.part_watched) +
                            "</span>" +
                            (s.rating > 0
                                ? '<span style="color:#f1c40f;font-size:0.75rem;margin-left:0.5rem;" title="' +
                                  s.rating +
                                  ' stars">' +
                                  "★".repeat(s.rating) +
                                  "</span>"
                                : "") +
                            (s.tvdb_slug
                                ? '<a class="ext-link" href="https://thetvdb.com/series/' +
                                  s.tvdb_slug +
                                  '" target="_blank" onclick="event.stopPropagation()" title="View on TheTVDB">↗</a>'
                                : "") +
                            "</div>" +
                            '<div style="margin-top:0.15rem;">' +
                            showStatsHtml(s, false) +
                            "</div>" +
                            "</div>" +
                            '<div class="show-detail" style="display:none;margin-top:0.75rem"></div></div>'
                        );
                    })
                    .join("");
            }

            function renderShowGrid(shows) {
                return shows
                    .map(function (s) {
                        return (
                            '<div class="grid-item" onclick="window.location.href=\'/show/' +
                            s.id +
                            "'\">" +
                            (s.poster_path
                                ? '<img class="grid-poster" src="' +
                                  s.poster_path +
                                  '" onerror="this.style.display=\'none\'">'
                                : '<div class="grid-poster"></div>') +
                            '<div class="grid-title">' +
                            escapeHtml(s.title) +
                            (s.first_aired &&
                            s.title.indexOf(s.first_aired.substring(0, 4)) ===
                                -1
                                ? " (" + s.first_aired.substring(0, 4) + ")"
                                : "") +
                            (s.watchlist
                                ? ' <span style="background:#f1c40f;color:#000;font-size:0.6rem;padding:0 0.3rem;border-radius:3px;font-weight:bold;vertical-align:middle;" title="On Watchlist">WL</span>'
                                : "") +
                            (s.hidden
                                ? ' <span style="background:#e0e4e8;color:#5b6472;font-size:0.6rem;padding:0 0.3rem;border-radius:3px;font-weight:bold;vertical-align:middle;" title="Hidden from listings">hidden</span>'
                                : "") +
                            (s.ended
                                ? ' <span style="background:#e8edf5;color:#4a5a72;font-size:0.6rem;padding:0 0.3rem;border-radius:3px;font-weight:bold;vertical-align:middle;" title="Marked as ended — no more seasons/episodes">ended</span>'
                                : "") +
                            "</div>" +
                            '<span class="badge ' +
                            watchBadgeClass(s.part_watched) +
                            '" style="font-size:0.65rem;">' +
                            watchBadgeLabel(s.part_watched) +
                            "</span>" +
                            (s.rating > 0
                                ? '<span style="color:#f1c40f;font-size:0.7rem;margin-left:0.4rem;">' +
                                  "★".repeat(s.rating) +
                                  "</span>"
                                : "") +
                            (s.created_at
                                ? '<div style="white-space:nowrap;color:var(--text-muted);font-size:0.6rem;margin-top:0.15rem;">added ' + formatDateLong(s.created_at.substring(0, 10)) + '</div>'
                                : "") +
                            '<div style="margin-top:0.2rem;">' +
                            showStatsHtml(s, true) +
                            "</div>" +
                            "</div>"
                        );
                    })
                    .join("");
            }

            function toggleShowView() {
                showViewMode = showViewMode === "list" ? "grid" : "list";
                var btn = document.getElementById("show-view-toggle");
                btn.textContent =
                    showViewMode === "grid" ? "☰ List" : "▦ Grid";
                applyShowFilters();
            }

            function renderShowDetail(show, cardEl) {
                return show.seasons
                    .map(function (season) {
                        var epHtml = season.episodes
                            .map(function (ep) {
                                return (
                                    "<li><span>S" +
                                    String(season.season_number).padStart(
                                        2,
                                        "0",
                                    ) +
                                    "E" +
                                    String(ep.episode_number).padStart(2, "0") +
                                    " - " +
                                    escapeHtml(
                                        ep.title ||
                                            "Episode " + ep.episode_number,
                                    ) +
                                    (ep.runtime
                                        ? " (" + ep.runtime + "m)"
                                        : "") +
                                    (ep.air_date
                                        ? ' <span style="color:var(--text-muted);font-size:0.7rem;">' +
                                          formatDateLong(ep.air_date) +
                                          "</span>"
                                        : "") +
                                    infoIcon(ep.overview) +
                                    "</span>" +
                                    '<span style="margin-left:auto;display:flex;align-items:center;gap:0.3rem;flex-shrink:0;">' +
                                    (ep.watched_at
                                        ? '<span style="color:var(--text-muted);font-size:0.65rem;">(' +
                                          formatDateLong(
                                              ep.watched_at.substring(0, 10),
                                          ) +
                                          ")</span>"
                                        : "") +
                                    '<span class="badge ' +
                                    (ep.watched
                                        ? "badge-watched"
                                        : "badge-unwatched") +
                                    '" onclick="event.stopPropagation();toggleShowEp(' +
                                    ep.id +
                                    "," +
                                    !ep.watched +
                                    ',event)" style="cursor:pointer"' +
                                    (ep.watched_at
                                        ? ' title="Watched: ' +
                                          formatDate(ep.watched_at) +
                                          '"'
                                        : "") +
                                    ">" +
                                    (ep.watched ? "✓ watched" : "unwatched") +
                                    "</span></span></li>"
                                );
                            })
                            .join("");
                        return (
                            '<div style="margin-top:0.5rem"><em>Season ' +
                            season.season_number +
                            "</em>" +
                            (season.created_at
                                ? ' <span style="color:var(--text-muted);font-size:0.7rem;">added ' +
                                  formatDateLong(season.created_at) +
                                  "</span>"
                                : "") +
                            '<span class="badge ' +
                            watchBadgeClass(season.part_watched) +
                            '" style="margin-left:0.5rem;font-size:0.7rem;">' +
                            watchBadgeLabel(season.part_watched) +
                            '</span><ul class="episode-list">' +
                            epHtml +
                            "</ul></div>"
                        );
                    })
                    .join("");
            }

            function renderPagination(type, total, page, perPage) {
                var el = document.getElementById(type + "-pagination");
                var pages = Math.ceil(total / perPage) || 1;
                var html = "";
                if (total > perPage) {
                    html +=
                        "<button onclick=\"goPage('" +
                        type +
                        "', " +
                        (page - 1) +
                        ')" ' +
                        (page <= 1 ? "disabled" : "") +
                        ">« Prev</button>";
                    var start = Math.max(1, page - 2);
                    var end = Math.min(pages, page + 2);
                    for (var i = start; i <= end; i++) {
                        html +=
                            '<button class="' +
                            (i === page ? "active" : "") +
                            '" onclick="goPage(\'' +
                            type +
                            "', " +
                            i +
                            ')">' +
                            i +
                            "</button>";
                    }
                    html +=
                        "<button onclick=\"goPage('" +
                        type +
                        "', " +
                        (page + 1) +
                        ')" ' +
                        (page >= pages ? "disabled" : "") +
                        ">Next »</button>";
                }
                html +=
                    "<select onchange=\"goPerPage('" +
                    type +
                    '\', this.value)"><option value="10"' +
                    (perPage === 10 ? " selected" : "") +
                    '>10</option><option value="25"' +
                    (perPage === 25 ? " selected" : "") +
                    '>25</option><option value="50"' +
                    (perPage === 50 ? " selected" : "") +
                    '>50</option><option value="100"' +
                    (perPage === 100 ? " selected" : "") +
                    ">100</option></select>";
                el.innerHTML = html;
            }

            function goPage(type, p) {
                if (type === "shows") {
                    showCurrentPage = p;
                    applyShowFilters();
                } else {
                    moviePage = p;
                    applyMovieFilters();
                }
            }

            function goPerPage(type, n) {
                n = parseInt(n);
                if (type === "shows") {
                    showPerPage = n;
                    showCurrentPage = 1;
                    applyShowFilters();
                } else {
                    moviePerPage = n;
                    moviePage = 1;
                    applyMovieFilters();
                }
            }

            function updateMovieFilterCounts() {
                var counts = {
                    all: allMovies.length,
                    watched: allMovies.filter(function (m) {
                        return m.watched;
                    }).length,
                    unwatched: allMovies.filter(function (m) {
                        return !m.watched;
                    }).length,
                    watchlist: allMovies.filter(function (m) {
                        return m.watchlist === true;
                    }).length,
                };
                document
                    .querySelectorAll("#page-movies .filter-btn")
                    .forEach(function (b) {
                        var key = b.getAttribute("data-filter");
                        var span = b.querySelector(".filter-count");
                        if (span && counts[key] !== undefined) {
                            span.textContent = counts[key];
                        }
                    });
            }
            function applyMovieFilters() {
                updateMovieFilterCounts();
                movieSearch = document
                    .getElementById("movies-search")
                    .value.toLowerCase();
                document.getElementById("movies-search-clear").style.display =
                    movieSearch ? "block" : "none";
                var filtered = allMovies;
                if (movieSearch)
                    filtered = filtered.filter(function (m) {
                        return (
                            m.title.toLowerCase().indexOf(movieSearch) !== -1
                        );
                    });
                if (movieFilter === "watched")
                    filtered = filtered.filter(function (m) {
                        return m.watched;
                    });
                else if (movieFilter === "unwatched")
                    filtered = filtered.filter(function (m) {
                        return !m.watched;
                    });
                else if (movieFilter === "watchlist")
                    filtered = filtered.filter(function (m) {
                        return m.watchlist === true;
                    });
                // Release-date filter (actual release date, not scan date)
                var airedFilter =
                    document.getElementById("movies-aired-filter").value;
                filtered = filtered.filter(function (m) {
                    return airedMatches(m.first_aired, airedFilter);
                });
                // Rating filter
                var ratingFilter = parseInt(
                    document.getElementById("movies-rating-filter").value,
                );
                if (ratingFilter > 0) {
                    filtered = filtered.filter(function (m) {
                        return m.rating === ratingFilter;
                    });
                }
                var sort = document.getElementById("movies-sort").value;
                if (airedFilter && airedFilter !== "all" && sort === "alpha") {
                    if (airedFilter === "upcoming") {
                        filtered = filtered.slice().sort(compareFirstAired);
                    } else {
                        filtered = filtered.slice().sort(function (a, b) {
                            return -compareFirstAired(a, b);
                        });
                    }
                } else if (sort === "recent")
                    filtered = filtered.slice().sort(function (a, b) {
                        return new Date(b.updated_at) - new Date(a.updated_at);
                    });
                else if (sort === "aired-desc")
                    filtered = filtered.slice().sort(function (a, b) {
                        return -compareFirstAired(a, b);
                    });
                else if (sort === "aired-asc")
                    filtered = filtered.slice().sort(compareFirstAired);
                else if (sort === "zalpha")
                    filtered = filtered.slice().sort(function (a, b) {
                        return b.title.localeCompare(a.title);
                    });
                else if (sort === "rating-desc")
                    filtered = filtered.slice().sort(function (a, b) {
                        return b.rating - a.rating;
                    });
                else if (sort === "rating-asc")
                    filtered = filtered.slice().sort(function (a, b) {
                        return a.rating - b.rating;
                    });
                document.getElementById("movie-count").textContent =
                    "(" + filtered.length + ")";
                moviePage = Math.min(
                    moviePage,
                    Math.ceil(filtered.length / moviePerPage) || 1,
                );
                var start = (moviePage - 1) * moviePerPage;
                var paged = filtered.slice(start, start + moviePerPage);
                var listEl = document.getElementById("movies-list");
                listEl.className = movieViewMode === "grid" ? "grid-view" : "";
                listEl.innerHTML =
                    movieViewMode === "grid"
                        ? renderMovieGrid(paged)
                        : renderMovieList(paged);
                renderPagination(
                    "movies",
                    filtered.length,
                    moviePage,
                    moviePerPage,
                );
            }
