            // ── SCAN ───────────────────────────────────────────────────────
            function setScanEnabled(enabled) {
                var btn = document.getElementById("scan-btn");
                if (!btn) return;
                btn.disabled = !enabled;
                btn.style.opacity = enabled ? "" : "0.5";
                btn.style.cursor = enabled ? "" : "not-allowed";
                btn.textContent = enabled ? "🔍 Scan" : "🔍 Scanning…";
            }

            function resetShowFilter() {
                showFilter = "all";
                document
                    .querySelectorAll("#page-shows .filter-btn")
                    .forEach(function (b) {
                        b.classList.remove("active");
                        if (b.getAttribute("data-filter") === "all") {
                            b.classList.add("active");
                        }
                    });
            }

            async function scanMedia() {
                setScanEnabled(false);
                resetShowFilter();
                // Switch to the Shows page so results are visible
                document.querySelectorAll("nav a").forEach(function (a) {
                    a.classList.remove("active");
                });
                var showsLink = document.querySelector("nav a");
                if (showsLink) showsLink.classList.add("active");
                document.getElementById("page-shows").style.display = "block";
                document.getElementById("page-movies").style.display = "none";

                // Replace the whole header with a scanning message while we run.
                // It is restored by fetchShows() (via applyShowFilters) on refresh.
                document.getElementById("shows-title-text").style.display = "none";
                document.getElementById("show-count").style.display = "none";
                document.getElementById("shows-scanning").style.display = "";

                var el = document.getElementById("shows-list");

                // Allow the scan to be cancelled client-side.
                var scanAbort = new AbortController();

                // Count-up timer for visual feedback
                var seconds = 0;
                var timerEl = document.createElement("p");
                timerEl.style.color = "var(--accent)";
                timerEl.style.fontWeight = "bold";
                timerEl.textContent = "Elapsed: 0s";
                var timer = setInterval(function () {
                    seconds++;
                    timerEl.textContent = "Elapsed: " + seconds + "s";
                }, 1000);

                var cancelBtn = document.createElement("button");
                cancelBtn.textContent = "✕ Cancel scan";
                cancelBtn.style.background = "var(--border)";
                cancelBtn.style.color = "var(--text)";
                cancelBtn.style.border = "1px solid var(--border)";
                cancelBtn.style.borderRadius = "4px";
                cancelBtn.style.padding = "0.3rem 0.7rem";
                cancelBtn.style.fontSize = "0.75rem";
                cancelBtn.style.cursor = "pointer";
                cancelBtn.style.marginTop = "0.25rem";
                cancelBtn.onclick = function () {
                    scanAbort.abort();
                };

                // Status area is rebuilt as the scan progresses so the user
                // can see the current phase (shows → movies).
                var statusEl = document.createElement("div");
                function renderStatus(html) {
                    el.innerHTML = "";
                    el.appendChild(statusEl);
                    el.appendChild(timerEl);
                    el.appendChild(cancelBtn);
                    statusEl.innerHTML = html;
                }

                renderStatus('<p class="loading">📺 Scanning shows...</p>');

                try {
                    var data = await apiFetch("/api/scan", {
                        method: "POST",
                        signal: scanAbort.signal,
                    });
                    var count =
                        data.shows_synced != null
                            ? data.shows_synced
                            : data._count || 0;
                    var html =
                        "<p>📺 Shows: found <strong>" + count + "</strong>.";
                    if (data.created != null)
                        html += " Created: " + data.created + ".";
                    if (data.skipped != null && data.skipped > 0)
                        html += " ⏭️ " + data.skipped + " skipped.";
                    if (data.deleted != null && data.deleted > 0)
                        html += " 🗑️ " + data.deleted + ".";
                    html +=
                        ' <button onclick="fetchShows()">Refresh</button></p>';

                    // Show a "scanning movies" phase while the movie scan runs.
                    html += "__MOVIES_STATUS__";
                    renderStatus(
                        html.replace(
                            "__MOVIES_STATUS__",
                            '<p class="loading">🎬 Scanning movies...</p>',
                        ),
                    );

                    try {
                        var md = await apiFetch("/api/movies/scan", {
                            method: "POST",
                            signal: scanAbort.signal,
                        });
                        var mc =
                            md.movies_synced != null ? md.movies_synced : 0;
                        var movieHtml =
                            "<p>🎬 Movies: found <strong>" + mc + "</strong>.";
                        if (md.created != null)
                            movieHtml += " Created: " + md.created + ".";
                        if (md.skipped != null && md.skipped > 0)
                            movieHtml += " ⏭️ " + md.skipped + " skipped.";
                        if (md.deleted != null && md.deleted > 0)
                            movieHtml += " 🗑️ " + md.deleted + ".";
                        movieHtml += "</p>";
                        renderStatus(
                            html.replace("__MOVIES_STATUS__", movieHtml),
                        );
                    } catch (e) {
                        if (scanAbort.signal.aborted) throw e;
                        renderStatus(
                            html.replace(
                                "__MOVIES_STATUS__",
                                "<p>🎬 Movies: scan failed — " +
                                    escapeHtml(e.message) +
                                    "</p>",
                            ),
                        );
                    }

                    clearInterval(timer);
                    // Drop the timer/cancel button and leave just the summary.
                    el.innerHTML = statusEl.innerHTML;

                    // Refresh the in-memory movie cache so soft-deleted movies
                    // disappear immediately. The Movies page only re-fetches
                    // when its cache is empty, so it would otherwise show stale
                    // results until the browser is refreshed.
                    await fetchMovies();
                    setScanEnabled(true);
                } catch (e) {
                    clearInterval(timer);
                    restoreShowsHeader();
                    if (scanAbort.signal.aborted) {
                        el.innerHTML =
                            '<p class="error">Scan cancelled.</p>' +
                            '<button onclick="location.reload()" style="background:var(--accent);color:#fff;border:none;padding:0.35rem 0.9rem;border-radius:4px;font-size:0.75rem;cursor:pointer;margin-right:0.5rem;">Refresh</button>' +
                            '<a href="/" style="color:var(--text-muted);font-size:0.75rem;">Back to start</a>';
                    } else {
                        el.innerHTML =
                            '<p class="error">Scan failed: ' +
                            escapeHtml(e.message) +
                            "</p>";
                    }
                    setScanEnabled(true);
                }
            }

            // ── CHECK MISSING ────────────────────────────────────────────────
            async function checkMissing() {
                resetShowFilter();
                // Force list view so the results render correctly (grid layout breaks them)
                showViewMode = "list";
                document.getElementById("show-view-toggle").textContent = "▦ Grid";
                var el = document.getElementById("shows-list");
                el.className = "";

                // Count-up timer so the user can see the check is still running
                var seconds = 0;
                var timerEl = document.createElement("p");
                timerEl.style.color = "var(--accent)";
                timerEl.style.fontWeight = "bold";
                timerEl.textContent = "Elapsed: 0s";
                var timer = setInterval(function () {
                    seconds++;
                    timerEl.textContent = "Elapsed: " + seconds + "s";
                }, 1000);

                el.innerHTML =
                    '<p class="loading">Checking TheTVDB for missing episodes...</p>';
                el.appendChild(timerEl);
                try {
                    var data = await apiFetch("/api/scan/check-missing?store=true");
                    clearInterval(timer);
                    if (data.status === "offline") {
                        el.innerHTML =
                            '<p class="error">' +
                            escapeHtml(data.message) +
                            "</p>";
                        return;
                    }
                    var html =
                        '<button onclick="fetchShows()">Refresh list</button><br><br>';
                    var hasMissing = false;
                    data.shows.forEach(function (s) {
                        if (s.status === "missing") {
                            hasMissing = true;
                            html +=
                                '<div class="card" style="padding:0.75rem;margin-bottom:0.5rem;"><strong>' +
                                escapeHtml(s.title) +
                                '</strong> — <span style="color:var(--accent);">' +
                                escapeHtml(s.message) +
                                "</span></div>";
                        }
                    });
                    var okCount = data.shows.filter(function (s) {
                        return s.status === "ok";
                    }).length;
                    var missingCount = data.shows.filter(function (s) {
                        return s.status === "missing";
                    }).length;
                    html =
                        '<p style="margin-bottom:0.75rem;"><strong>' +
                        okCount +
                        '</strong> shows up to date, <strong style="color:var(--accent);">' +
                        missingCount +
                        "</strong> with missing episodes.</p>" +
                        html;
                    if (!hasMissing) {
                        html +=
                            '<p style="color:var(--text-muted);">All shows are up to date ✓</p>';
                    }
                    el.innerHTML = html;
                } catch (e) {
                    clearInterval(timer);
                    el.innerHTML =
                        '<p class="error">Check failed: ' +
                        escapeHtml(e.message) +
                        "</p>";
                }
            }

            // ── Init ───────────────────────────────────────────────────────
            function restoreShowUI() {
                // Restore search input
                if (showSearch) {
                    document.getElementById("shows-search").value = showSearch;
                }
                // Restore active filter button
                document
                    .querySelectorAll("#page-shows .filter-btn")
                    .forEach(function (b) {
                        b.classList.remove("active");
                    });
                // Set the active filter button based on showFilter
                document
                    .querySelectorAll("#page-shows .filter-btn")
                    .forEach(function (b) {
                        if (b.getAttribute("data-filter") === showFilter) {
                            b.classList.add("active");
                        }
                    });
                // Restore view toggle label
                document.getElementById("show-view-toggle").textContent =
                    showViewMode === "grid" ? "☰ List" : "▦ Grid";
            }

            // ── Locale ────────────────────────────────────────────────────
            function onLocaleSelect() {
                applyShowFilters();
                applyMovieFilters();
            }
            document.getElementById("locale-toggle").textContent =
                TVTracI18n.currentFlag();
            document.getElementById("locale-toggle").title =
                TVTracI18n.currentLabel();

            loadShowState();
            restoreShowUI();

            // Switch to movies tab if requested via URL (?tab=movies)
            var params = new URLSearchParams(window.location.search);
            if (params.get("tab") === "movies") {
                var moviesLink = document.querySelectorAll("nav a")[1];
                if (moviesLink) showPage("movies", moviesLink);
            }

            fetchShows();
        </script>
    </body>
</html>
