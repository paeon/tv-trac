<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TV-Trac</title>
        <style>
            :root {
                --bg: #1a1a2e;
                --surface: #16213e;
                --accent: #e94560;
                --text: #eee;
                --text-muted: #999;
                --border: #333;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.6;
            }
            header {
                background: var(--surface);
                padding: 1.5rem 2rem;
                border-bottom: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            header h1 {
                font-size: 1.5rem;
                color: var(--accent);
            }
            nav {
                display: flex;
                gap: 0;
                border-bottom: 1px solid var(--border);
                margin-bottom: 1rem;
            }
            nav a {
                color: var(--text-muted);
                text-decoration: none;
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
                border-bottom: 2px solid transparent;
                cursor: pointer;
            }
            nav a.active {
                color: var(--accent);
                border-bottom-color: var(--accent);
            }
            main {
                max-width: 960px;
                margin: 2rem auto;
                padding: 0 1rem;
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1.5rem;
                margin-bottom: 1rem;
            }
            .badge {
                display: inline-block;
                padding: 0.15rem 0.6rem;
                border-radius: 12px;
                font-size: 0.75rem;
                font-weight: 600;
            }
            .badge-watched {
                background: #2ecc71;
                color: #fff;
            }
            .badge-unwatched {
                background: var(--border);
                color: var(--text-muted);
            }
            .badge-partial {
                background: #f39c12;
                color: #fff;
            }
            button {
                background: var(--accent);
                color: #fff;
                border: none;
                padding: 0.5rem 1.2rem;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.9rem;
            }
            button:hover {
                opacity: 0.85;
            }
            .filter-bar {
                display: flex;
                gap: 0.5rem;
                align-items: center;
                margin-bottom: 1rem;
                flex-wrap: wrap;
            }
            .search-wrapper {
                position: relative;
                flex: 1;
                min-width: 180px;
            }
            .search-wrapper input {
                width: 100%;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--text);
                padding: 0.5rem 2rem 0.5rem 0.8rem;
                font-size: 0.9rem;
            }
            .search-wrapper input::placeholder {
                color: var(--text-muted);
            }
            .search-clear {
                position: absolute;
                right: 6px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: var(--text-muted);
                cursor: pointer;
                font-size: 1rem;
                padding: 2px 4px;
                display: none;
            }
            .search-clear:hover {
                color: var(--text);
            }
            .filter-btn {
                background: var(--surface);
                color: var(--text-muted);
                border: 1px solid var(--border);
                padding: 0.4rem 1rem;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.8rem;
                white-space: nowrap;
            }
            .filter-btn.active {
                background: var(--accent);
                color: #fff;
                border-color: var(--accent);
            }
            .page-nav {
                display: flex;
                gap: 0.25rem;
                align-items: center;
                justify-content: center;
                margin-top: 1rem;
                flex-wrap: wrap;
            }
            .page-nav button {
                background: var(--surface);
                color: var(--text-muted);
                border: 1px solid var(--border);
                padding: 0.3rem 0.6rem;
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.75rem;
            }
            .page-nav button.active {
                background: var(--accent);
                color: #fff;
                border-color: var(--accent);
            }
            .page-nav button:disabled {
                opacity: 0.3;
                cursor: default;
            }
            .page-nav select {
                background: var(--surface);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 4px;
                padding: 0.3rem;
                font-size: 0.75rem;
                margin-left: 0.5rem;
            }
            .episode-list {
                list-style: none;
                margin-top: 0.5rem;
            }
            .episode-list li {
                padding: 0.4rem 0;
                border-bottom: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .episode-list li:last-child {
                border-bottom: none;
            }
            .loading {
                color: var(--text-muted);
                font-style: italic;
            }
            .error {
                color: var(--accent);
                white-space: pre-wrap;
                font-size: 0.85rem;
            }
            .info-icon {
                display: inline-block;
                width: 16px;
                height: 16px;
                line-height: 16px;
                text-align: center;
                border-radius: 50%;
                background: var(--border);
                color: var(--text-muted);
                font-size: 10px;
                font-weight: bold;
                cursor: pointer;
                margin: 0 0.3rem;
                vertical-align: middle;
                user-select: none;
            }
            .info-icon:hover {
                background: var(--accent);
                color: #fff;
            }
            .notes-icon {
                display: inline-block;
                width: 18px;
                height: 18px;
                line-height: 18px;
                text-align: center;
                border: 1px solid var(--text-muted);
                border-radius: 3px;
                color: var(--text-muted);
                cursor: pointer;
                font-size: 10px;
                font-weight: bold;
                margin: 0 0.3rem;
                vertical-align: middle;
                user-select: none;
            }
            .notes-icon.has-notes {
                background: #f1c40f;
                border-color: #f1c40f;
                color: #000;
            }
            .thumb {
                width: 40px;
                height: 56px;
                object-fit: cover;
                border-radius: 4px;
                margin-right: 0.75rem;
                flex-shrink: 0;
                background: var(--border);
            }
            .ext-link {
                color: var(--text-muted);
                text-decoration: none;
                font-size: 0.7rem;
                margin-left: 0.3rem;
            }
            .ext-link:hover {
                color: var(--accent);
            }
            .card-title {
                display: flex;
                align-items: flex-start;
            }
            .card-title-text {
                flex: 1;
            }
            .notes-editor {
                margin-top: 0.5rem;
            }
            .notes-editor textarea {
                width: 100%;
                background: var(--bg);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 0.5rem;
                font-size: 0.8rem;
                resize: vertical;
                min-height: 60px;
                font-family: inherit;
            }
            .notes-editor button {
                margin-top: 0.3rem;
                font-size: 0.75rem;
                padding: 0.25rem 0.8rem;
            }
            .popover {
                position: fixed;
                z-index: 1000;
                background: #1e2a4a;
                border: 1px solid var(--accent);
                border-radius: 8px;
                padding: 0.75rem 1rem;
                max-width: 380px;
                font-size: 0.85rem;
                color: var(--text);
                line-height: 1.5;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            }
            footer {
                text-align: center;
                padding: 1.5rem;
                color: var(--text-muted);
                font-size: 0.7rem;
            }
            footer img {
                height: 20px;
                vertical-align: middle;
                margin: 0 0.5rem;
            }
            footer a {
                color: var(--text-muted);
                text-decoration: none;
            }
            footer a:hover {
                color: var(--text);
            }
        </style>
    </head>
    <body>
        <header>
            <h1>📺 TV-Trac</h1>
            <div>
                <span
                    id="media-label"
                    style="color: var(--text-muted); font-size: 0.85rem"
                    >TV: {{ media_tv }}</span
                >
                <button onclick="scanMedia()" style="margin-left: 1rem">
                    🔍 Scan
                </button>
            </div>
        </header>
        <nav>
            <a class="active" onclick="showPage('shows', this)">📺 Shows</a>
            <a onclick="showPage('movies', this)">🎬 Movies</a>
        </nav>
        <main>
            <!-- SHOWS PAGE -->
            <div id="page-shows">
                <div
                    class="filter-bar"
                    id="shows-filter-bar"
                    style="display: none"
                >
                    <div class="search-wrapper">
                        <input
                            type="text"
                            id="shows-search"
                            placeholder="Search shows..."
                            oninput="applyShowFilters()"
                        />
                        <button
                            class="search-clear"
                            id="shows-search-clear"
                            onclick="clearShowSearch()"
                        >
                            ✕
                        </button>
                    </div>
                    <button
                        class="filter-btn active"
                        onclick="setShowFilter('all', this)"
                    >
                        All
                    </button>
                    <button
                        class="filter-btn"
                        onclick="setShowFilter('watched', this)"
                    >
                        ✓ Watched
                    </button>
                    <button
                        class="filter-btn"
                        onclick="setShowFilter('partial', this)"
                    >
                        ◐ Partial
                    </button>
                    <button
                        class="filter-btn"
                        onclick="setShowFilter('unwatched', this)"
                    >
                        ○ Unwatched
                    </button>
                    <select
                        id="shows-sort"
                        onchange="applyShowFilters()"
                        style="
                            background: var(--surface);
                            color: var(--text);
                            border: 1px solid var(--border);
                            border-radius: 6px;
                            padding: 0.4rem 0.6rem;
                            font-size: 0.8rem;
                            margin-left: auto;
                        "
                    >
                        <option value="alpha">A-Z</option>
                        <option value="recent">Recently Added</option>
                    </select>
                </div>
                <div class="card">
                    <h2>
                        Your Shows
                        <span
                            id="show-count"
                            style="color: var(--text-muted); font-size: 0.85rem"
                        ></span>
                    </h2>
                    <div id="shows-list" class="loading">Loading shows...</div>
                    <div id="shows-pagination" class="page-nav"></div>
                </div>
            </div>

            <!-- MOVIES PAGE -->
            <div id="page-movies" style="display: none">
                <div
                    class="filter-bar"
                    id="movies-filter-bar"
                    style="display: none"
                >
                    <div class="search-wrapper">
                        <input
                            type="text"
                            id="movies-search"
                            placeholder="Search movies..."
                            oninput="applyMovieFilters()"
                        />
                        <button
                            class="search-clear"
                            id="movies-search-clear"
                            onclick="clearMovieSearch()"
                        >
                            ✕
                        </button>
                    </div>
                    <button
                        class="filter-btn active"
                        onclick="setMovieFilter('all', this)"
                    >
                        All
                    </button>
                    <button
                        class="filter-btn"
                        onclick="setMovieFilter('watched', this)"
                    >
                        ✓ Watched
                    </button>
                    <button
                        class="filter-btn"
                        onclick="setMovieFilter('unwatched', this)"
                    >
                        ○ Unwatched
                    </button>
                    <select
                        id="movies-sort"
                        onchange="applyMovieFilters()"
                        style="
                            background: var(--surface);
                            color: var(--text);
                            border: 1px solid var(--border);
                            border-radius: 6px;
                            padding: 0.4rem 0.6rem;
                            font-size: 0.8rem;
                            margin-left: auto;
                        "
                    >
                        <option value="alpha">A-Z</option>
                        <option value="recent">Recently Added</option>
                    </select>
                </div>
                <div class="card">
                    <h2>
                        Your Movies
                        <span
                            id="movie-count"
                            style="color: var(--text-muted); font-size: 0.85rem"
                        ></span>
                    </h2>
                    <div id="movies-list" class="loading">
                        Loading movies...
                    </div>
                    <div id="movies-pagination" class="page-nav"></div>
                </div>
            </div>
        </main>

        <footer>
            <span>
                TV data provided by
                <a href="https://thetvdb.com" target="_blank">TheTVDB</a>. Movie
                data provided by
                <a href="https://www.themoviedb.org" target="_blank">TMDB</a>.
            </span>
        </footer>

        <script>
            // ── Navigation ─────────────────────────────────────────────────
            function showPage(page, link) {
                document.querySelectorAll("nav a").forEach(function (a) {
                    a.classList.remove("active");
                });
                link.classList.add("active");
                document.getElementById("page-shows").style.display =
                    page === "shows" ? "block" : "none";
                document.getElementById("page-movies").style.display =
                    page === "movies" ? "block" : "none";
                document.getElementById("media-label").textContent =
                    page === "movies"
                        ? "Movies: /media/movies"
                        : "TV: /media/tv";
                if (page === "movies" && allMovies.length === 0) fetchMovies();
            }

            // ── API ────────────────────────────────────────────────────────
            var SHOWS_API = "/api/shows";
            var MOVIES_API = "/api/movies";
            var allShows = [],
                allMovies = [];

            async function apiFetch(url, opts) {
                var resp = await fetch(url, opts);
                if (!resp.ok) {
                    var body = await resp.json().catch(function () {
                        return null;
                    });
                    var err = new Error("HTTP " + resp.status);
                    err.body = body;
                    throw err;
                }
                return resp.json();
            }

            // ── Popover ────────────────────────────────────────────────────
            var activePopover = null;
            function dismissPopover() {
                if (activePopover) {
                    activePopover.remove();
                    activePopover = null;
                }
            }
            document.addEventListener(
                "click",
                function (e) {
                    if (e.target.classList.contains("info-icon")) {
                        e.stopPropagation();
                        e.preventDefault();
                        if (activePopover) {
                            dismissPopover();
                            return;
                        }
                        var overview = e.target.getAttribute("data-overview");
                        if (!overview) return;
                        var pop = document.createElement("div");
                        pop.className = "popover";
                        pop.textContent = overview;
                        document.body.appendChild(pop);
                        var rect = e.target.getBoundingClientRect();
                        var top = rect.bottom + 4,
                            left = Math.max(8, rect.left - 180);
                        if (top + 120 > window.innerHeight)
                            top = rect.top - 130;
                        pop.style.top = top + "px";
                        pop.style.left = left + "px";
                        activePopover = pop;
                        return;
                    }
                    if (activePopover) dismissPopover();
                },
                true,
            );

            // ── Helpers ────────────────────────────────────────────────────
            function escapeHtml(s) {
                var d = document.createElement("div");
                d.textContent = s;
                return d.innerHTML;
            }
            function infoIcon(overview) {
                if (!overview) return "";
                return (
                    '<span class="info-icon" data-overview="' +
                    escapeHtml(overview).replace(/"/g, "&quot;") +
                    '" title="Overview">i</span>'
                );
            }
            function watchBadgeClass(s) {
                if (s === "watched") return "badge-watched";
                if (s === "partial") return "badge-partial";
                return "badge-unwatched";
            }
            function watchBadgeLabel(s) {
                if (s === "watched") return "watched";
                if (s === "partial") return "part watched";
                return "unwatched";
            }
            var MONTHS = [
                "Jan",
                "Feb",
                "Mar",
                "Apr",
                "May",
                "Jun",
                "Jul",
                "Aug",
                "Sep",
                "Oct",
                "Nov",
                "Dec",
            ];
            function formatDateLong(d) {
                if (!d) return "";
                var p = d.split("-");
                if (p.length !== 3) return d;
                var y = parseInt(p[0]),
                    m = parseInt(p[1]),
                    dd = parseInt(p[2]);
                if (isNaN(y) || isNaN(m) || isNaN(dd)) return d;
                return MONTHS[m - 1] + " " + dd + ", " + y;
            }
            function formatDate(isoStr) {
                var dt = new Date(isoStr + (isoStr.endsWith("Z") ? "" : "Z"));
                var dd = String(dt.getDate()).padStart(2, "0"),
                    mm = String(dt.getMonth() + 1).padStart(2, "0"),
                    yyyy = dt.getFullYear(),
                    hh = String(dt.getHours()).padStart(2, "0"),
                    min = String(dt.getMinutes()).padStart(2, "0"),
                    ss = String(dt.getSeconds()).padStart(2, "0");
                return (
                    dd + "/" + mm + "/" + yyyy + " " + hh + ":" + min + ":" + ss
                );
            }

            // ── Notes ──────────────────────────────────────────────────────
            function toggleNotes(id, iconEl, ev, api) {
                ev.stopPropagation();
                var card = iconEl.closest(".card");
                var existing = card.querySelector(".notes-editor");
                if (existing) {
                    existing.remove();
                    return;
                }
                var editor = document.createElement("div");
                editor.className = "notes-editor";
                editor.innerHTML =
                    '<textarea id="notes-ta-' +
                    id +
                    '" placeholder="Add notes...">' +
                    escapeHtml(
                        iconEl.title !== "Add notes" ? iconEl.title : "",
                    ) +
                    '</textarea><button onclick="saveNotes(' +
                    id +
                    ",this,'" +
                    api +
                    '\')">Save</button> <button onclick="this.parentElement.remove()" style="background:var(--border)">Cancel</button>';
                card.appendChild(editor);
                document.getElementById("notes-ta-" + id).focus();
            }
            async function saveNotes(id, btn, api) {
                var ta = document.getElementById("notes-ta-" + id);
                var notes = ta ? ta.value : "";
                await apiFetch(
                    api +
                        "/" +
                        id +
                        "/notes?notes=" +
                        encodeURIComponent(notes),
                    { method: "PATCH" },
                );
                var icon = document.querySelector(
                    '.card[data-show-id="' +
                        id +
                        '"] .notes-icon, .card[data-movie-id="' +
                        id +
                        '"] .notes-icon',
                );
                if (icon) {
                    icon.className =
                        "notes-icon" + (notes.trim() ? " has-notes" : "");
                    icon.title = notes.trim() ? notes : "Add notes";
                }
                btn.parentElement.remove();
            }

            // ── SHOWS ──────────────────────────────────────────────────────
            var showFilter = "all",
                showSearch = "",
                showCurrentPage = 1,
                showPerPage = 10;
            function setShowFilter(f, btn) {
                showFilter = f;
                document
                    .querySelectorAll("#page-shows .filter-btn")
                    .forEach(function (b) {
                        b.classList.remove("active");
                    });
                btn.classList.add("active");
                applyShowFilters();
            }
            function clearShowSearch() {
                document.getElementById("shows-search").value = "";
                applyShowFilters();
                document.getElementById("shows-search").focus();
            }
            function applyShowFilters() {
                showSearch = document
                    .getElementById("shows-search")
                    .value.toLowerCase();
                document.getElementById("shows-search-clear").style.display =
                    showSearch ? "block" : "none";
                var filtered = allShows;
                if (showSearch)
                    filtered = filtered.filter(function (s) {
                        return s.title.toLowerCase().indexOf(showSearch) !== -1;
                    });
                if (showFilter === "watched")
                    filtered = filtered.filter(function (s) {
                        return s.part_watched === "watched";
                    });
                else if (showFilter === "partial")
                    filtered = filtered.filter(function (s) {
                        return s.part_watched === "partial";
                    });
                else if (showFilter === "unwatched")
                    filtered = filtered.filter(function (s) {
                        return s.part_watched === "unwatched";
                    });
                var sort = document.getElementById("shows-sort").value;
                if (sort === "recent")
                    filtered = filtered.slice().sort(function (a, b) {
                        return new Date(b.updated_at) - new Date(a.updated_at);
                    });
                document.getElementById("show-count").textContent =
                    "(" + filtered.length + ")";
                // Paginate
                showCurrentPage = Math.min(
                    showCurrentPage,
                    Math.ceil(filtered.length / showPerPage) || 1,
                );
                var start = (showCurrentPage - 1) * showPerPage;
                var paged = filtered.slice(start, start + showPerPage);
                document.getElementById("shows-list").innerHTML =
                    renderShowList(paged);
                renderPagination(
                    "shows",
                    filtered.length,
                    showCurrentPage,
                    showPerPage,
                );
            }
            function renderShowList(shows) {
                return shows
                    .map(function (s) {
                        return (
                            '<div class="card" data-show-id="' +
                            s.id +
                            '" style="cursor:pointer" onclick="loadShow(' +
                            s.id +
                            ',this)">' +
                            '<div class="card-title">' +
                            (s.poster_path
                                ? '<img class="thumb" src="' +
                                  s.poster_path +
                                  '" onerror="this.style.display=\'none\'">'
                                : "") +
                            '<div class="card-title-text">' +
                            "<strong>" +
                            escapeHtml(s.title) +
                            (s.first_aired &&
                            s.title.indexOf(s.first_aired.substring(0, 4)) ===
                                -1
                                ? " (" + s.first_aired.substring(0, 4) + ")"
                                : "") +
                            "</strong>" +
                            (s.first_aired
                                ? ' <span style="color:var(--text-muted);font-size:0.8rem;">' +
                                  formatDateLong(s.first_aired) +
                                  "</span>"
                                : "") +
                            infoIcon(s.overview) +
                            '<span class="notes-icon' +
                            (s.notes ? " has-notes" : "") +
                            '" onclick="event.stopPropagation();toggleNotes(' +
                            s.id +
                            ",this,event,'" +
                            SHOWS_API +
                            '\')" title="' +
                            (s.notes ? escapeHtml(s.notes) : "Add notes") +
                            '">N</span>' +
                            '<span class="badge ' +
                            watchBadgeClass(s.part_watched) +
                            '" style="margin-left:0.5rem;">' +
                            watchBadgeLabel(s.part_watched) +
                            "</span>" +
                            (s.tvdb_slug
                                ? '<a class="ext-link" href="https://thetvdb.com/series/' +
                                  s.tvdb_slug +
                                  '" target="_blank" onclick="event.stopPropagation()" title="View on TheTVDB">↗</a>'
                                : "") +
                            "</div></div>" +
                            '<div class="show-detail" style="display:none;margin-top:0.75rem"></div></div>'
                        );
                    })
                    .join("");
            }
            function renderShowDetail(show, cardEl) {
                return show.seasons
                    .map(function (season) {
                        var epHtml = season.episodes
                            .map(function (ep) {
                                return (
                                    "<li><span>S" +
                                    String(season.season_number).padStart(
                                        2,
                                        "0",
                                    ) +
                                    "E" +
                                    String(ep.episode_number).padStart(2, "0") +
                                    " - " +
                                    escapeHtml(
                                        ep.title ||
                                            "Episode " + ep.episode_number,
                                    ) +
                                    (ep.runtime
                                        ? " (" + ep.runtime + "m)"
                                        : "") +
                                    (ep.air_date
                                        ? ' <span style="color:var(--text-muted);font-size:0.7rem;">' +
                                          formatDateLong(ep.air_date) +
                                          "</span>"
                                        : "") +
                                    infoIcon(ep.overview) +
                                    "</span>" +
                                    '<span style="margin-left:auto;display:flex;align-items:center;gap:0.3rem;flex-shrink:0;">' +
                                    (ep.watched_at
                                        ? '<span style="color:var(--text-muted);font-size:0.65rem;">(' +
                                          formatDateLong(
                                              ep.watched_at.substring(0, 10),
                                          ) +
                                          ")</span>"
                                        : "") +
                                    '<span class="badge ' +
                                    (ep.watched
                                        ? "badge-watched"
                                        : "badge-unwatched") +
                                    '" onclick="event.stopPropagation();toggleShowEp(' +
                                    ep.id +
                                    "," +
                                    !ep.watched +
                                    ',event)" style="cursor:pointer"' +
                                    (ep.watched_at
                                        ? ' title="Watched: ' +
                                          formatDate(ep.watched_at) +
                                          '"'
                                        : "") +
                                    ">" +
                                    (ep.watched ? "✓ watched" : "unwatched") +
                                    "</span></span></li>"
                                );
                            })
                            .join("");
                        return (
                            '<div style="margin-top:0.5rem"><em>Season ' +
                            season.season_number +
                            "</em>" +
                            (season.created_at
                                ? ' <span style="color:var(--text-muted);font-size:0.7rem;">added ' +
                                  formatDateLong(season.created_at) +
                                  "</span>"
                                : "") +
                            '<span class="badge ' +
                            watchBadgeClass(season.part_watched) +
                            '" style="margin-left:0.5rem;font-size:0.7rem;">' +
                            watchBadgeLabel(season.part_watched) +
                            '</span><ul class="episode-list">' +
                            epHtml +
                            "</ul></div>"
                        );
                    })
                    .join("");
            }

            function renderPagination(type, total, page, perPage) {
                var el = document.getElementById(type + "-pagination");
                var pages = Math.ceil(total / perPage) || 1;
                var html = "";
                if (total > perPage) {
                    html +=
                        "<button onclick=\"goPage('" +
                        type +
                        "', " +
                        (page - 1) +
                        ')" ' +
                        (page <= 1 ? "disabled" : "") +
                        ">« Prev</button>";
                    var start = Math.max(1, page - 2);
                    var end = Math.min(pages, page + 2);
                    for (var i = start; i <= end; i++) {
                        html +=
                            '<button class="' +
                            (i === page ? "active" : "") +
                            '" onclick="goPage(\'' +
                            type +
                            "', " +
                            i +
                            ')">' +
                            i +
                            "</button>";
                    }
                    html +=
                        "<button onclick=\"goPage('" +
                        type +
                        "', " +
                        (page + 1) +
                        ')" ' +
                        (page >= pages ? "disabled" : "") +
                        ">Next »</button>";
                }
                html +=
                    "<select onchange=\"goPerPage('" +
                    type +
                    '\', this.value)"><option value="10"' +
                    (perPage === 10 ? " selected" : "") +
                    '>10</option><option value="25"' +
                    (perPage === 25 ? " selected" : "") +
                    '>25</option><option value="50"' +
                    (perPage === 50 ? " selected" : "") +
                    '>50</option><option value="100"' +
                    (perPage === 100 ? " selected" : "") +
                    ">100</option></select>";
                el.innerHTML = html;
            }

            function goPage(type, p) {
                if (type === "shows") {
                    showCurrentPage = p;
                    applyShowFilters();
                } else {
                    moviePage = p;
                    applyMovieFilters();
                }
            }

            function goPerPage(type, n) {
                n = parseInt(n);
                if (type === "shows") {
                    showPerPage = n;
                    showCurrentPage = 1;
                    applyShowFilters();
                } else {
                    moviePerPage = n;
                    moviePage = 1;
                    applyMovieFilters();
                }
            }

            async function fetchShows() {
                try {
                    allShows = await apiFetch(SHOWS_API);
                    document.getElementById("shows-filter-bar").style.display =
                        allShows.length ? "flex" : "none";
                    applyShowFilters();
                } catch (e) {
                    document.getElementById("shows-list").innerHTML =
                        '<p class="error">Failed: ' +
                        escapeHtml(e.message) +
                        "</p>";
                }
            }
            async function loadShow(showId, cardEl, forceOpen) {
                var detail = cardEl.querySelector(".show-detail");
                if (!forceOpen && detail.style.display === "block") {
                    detail.style.display = "none";
                    return;
                }
                detail.style.display = "block";
                detail.innerHTML = '<p class="loading">Loading...</p>';
                try {
                    var show = await apiFetch(SHOWS_API + "/" + showId);
                    detail.innerHTML = renderShowDetail(show, cardEl);
                } catch (e) {
                    detail.innerHTML =
                        '<p class="error">' + escapeHtml(e.message) + "</p>";
                }
            }
            async function toggleShowEp(epId, watched, ev) {
                await fetch(
                    SHOWS_API +
                        "/episodes/" +
                        epId +
                        "/watch?watched=" +
                        watched,
                    { method: "PATCH" },
                );
                var card = ev.target.closest(".card");
                if (card) {
                    var sid = card.getAttribute("data-show-id");
                    if (sid) loadShow(parseInt(sid), card, true);
                }
                refreshShowBadges();
            }
            async function refreshShowBadges() {
                try {
                    var shows = await apiFetch(SHOWS_API);
                    allShows = shows;
                    document.getElementById("show-count").textContent =
                        "(" + shows.length + ")";
                    document
                        .querySelectorAll(".card[data-show-id]")
                        .forEach(function (card) {
                            var sid = parseInt(
                                card.getAttribute("data-show-id"),
                            );
                            var s = shows.find(function (x) {
                                return x.id === sid;
                            });
                            if (s) {
                                var b = card.querySelector(".badge");
                                if (b) {
                                    b.className =
                                        "badge " +
                                        watchBadgeClass(s.part_watched);
                                    b.textContent = watchBadgeLabel(
                                        s.part_watched,
                                    );
                                }
                            }
                        });
                } catch (e) {}
            }

            // ── MOVIES ──────────────────────────────────────────────────────
            var movieFilter = "all",
                movieSearch = "",
                moviePage = 1,
                moviePerPage = 10;
            function setMovieFilter(f, btn) {
                movieFilter = f;
                document
                    .querySelectorAll("#page-movies .filter-btn")
                    .forEach(function (b) {
                        b.classList.remove("active");
                    });
                btn.classList.add("active");
                applyMovieFilters();
            }
            function clearMovieSearch() {
                document.getElementById("movies-search").value = "";
                applyMovieFilters();
                document.getElementById("movies-search").focus();
            }
            function applyMovieFilters() {
                movieSearch = document
                    .getElementById("movies-search")
                    .value.toLowerCase();
                document.getElementById("movies-search-clear").style.display =
                    movieSearch ? "block" : "none";
                var filtered = allMovies;
                if (movieSearch)
                    filtered = filtered.filter(function (m) {
                        return (
                            m.title.toLowerCase().indexOf(movieSearch) !== -1
                        );
                    });
                if (movieFilter === "watched")
                    filtered = filtered.filter(function (m) {
                        return m.watched;
                    });
                else if (movieFilter === "unwatched")
                    filtered = filtered.filter(function (m) {
                        return !m.watched;
                    });
                var sort = document.getElementById("movies-sort").value;
                if (sort === "recent")
                    filtered = filtered.slice().sort(function (a, b) {
                        return new Date(b.updated_at) - new Date(a.updated_at);
                    });
                document.getElementById("movie-count").textContent =
                    "(" + filtered.length + ")";
                moviePage = Math.min(
                    moviePage,
                    Math.ceil(filtered.length / moviePerPage) || 1,
                );
                var start = (moviePage - 1) * moviePerPage;
                var paged = filtered.slice(start, start + moviePerPage);
                document.getElementById("movies-list").innerHTML =
                    renderMovieList(paged);
                renderPagination(
                    "movies",
                    filtered.length,
                    moviePage,
                    moviePerPage,
                );
            }
            function renderMovieList(movies) {
                return movies
                    .map(function (m) {
                        return (
                            '<div class="card" data-movie-id="' +
                            m.id +
                            '">' +
                            '<div class="card-title">' +
                            (m.poster_path
                                ? '<img class="thumb" src="' +
                                  m.poster_path +
                                  '" onerror="this.style.display=\'none\'">'
                                : "") +
                            '<div class="card-title-text">' +
                            "<strong>" +
                            escapeHtml(m.title) +
                            (m.first_aired &&
                            m.title.indexOf(m.first_aired.substring(0, 4)) ===
                                -1
                                ? " (" + m.first_aired.substring(0, 4) + ")"
                                : "") +
                            "</strong>" +
                            (m.first_aired
                                ? ' <span style="color:var(--text-muted);font-size:0.8rem;">' +
                                  formatDateLong(m.first_aired) +
                                  "</span>"
                                : "") +
                            (m.runtime
                                ? ' <span style="color:var(--text-muted);font-size:0.75rem;">' +
                                  m.runtime +
                                  "m</span>"
                                : "") +
                            infoIcon(m.overview) +
                            '<span class="notes-icon' +
                            (m.notes ? " has-notes" : "") +
                            '" onclick="event.stopPropagation();toggleNotes(' +
                            m.id +
                            ",this,event,'" +
                            MOVIES_API +
                            '\')" title="' +
                            (m.notes ? escapeHtml(m.notes) : "Add notes") +
                            '">N</span>' +
                            '<span class="badge ' +
                            (m.watched ? "badge-watched" : "badge-unwatched") +
                            '" onclick="toggleMovieWatched(' +
                            m.id +
                            "," +
                            !m.watched +
                            ',event)" style="cursor:pointer;margin-left:0.5rem;"' +
                            (m.watched_at
                                ? ' title="Watched: ' +
                                  formatDate(m.watched_at) +
                                  '"'
                                : "") +
                            ">" +
                            (m.watched ? "✓ watched" : "unwatched") +
                            "</span>" +
                            (m.tmdb_id
                                ? '<a class="ext-link" href="https://www.themoviedb.org/movie/' +
                                  m.tmdb_id +
                                  '" target="_blank" onclick="event.stopPropagation()" title="View on TMDB">↗</a>'
                                : "") +
                            (m.watched_at
                                ? ' <span style="color:var(--text-muted);font-size:0.65rem;">(' +
                                  formatDateLong(
                                      m.watched_at.substring(0, 10),
                                  ) +
                                  ")</span>"
                                : "") +
                            "</div></div></div>"
                        );
                    })
                    .join("");
            }
            async function fetchMovies() {
                try {
                    allMovies = await apiFetch(MOVIES_API);
                    document.getElementById("movies-filter-bar").style.display =
                        allMovies.length ? "flex" : "none";
                    applyMovieFilters();
                } catch (e) {
                    document.getElementById("movies-list").innerHTML =
                        '<p class="error">Failed: ' +
                        escapeHtml(e.message) +
                        "</p>";
                }
            }
            async function toggleMovieWatched(movieId, watched, ev) {
                ev.stopPropagation();
                await apiFetch(
                    MOVIES_API + "/" + movieId + "/watch?watched=" + watched,
                    { method: "PATCH" },
                );
                var updated = await apiFetch(MOVIES_API + "/" + movieId);
                var existing = allMovies.find(function (m) {
                    return m.id === movieId;
                });
                if (existing) {
                    existing.watched = updated.watched;
                    existing.watched_at = updated.watched_at;
                }
                applyMovieFilters();
            }

            // ── SCAN ───────────────────────────────────────────────────────
            async function scanMedia() {
                var el = document.getElementById("shows-list");
                el.innerHTML = '<p class="loading">Scanning shows...</p>';
                try {
                    var data = await apiFetch("/api/scan", { method: "POST" });
                    var count =
                        data.shows_synced != null
                            ? data.shows_synced
                            : data._count || 0;
                    var html =
                        "<p>📺 Shows: found <strong>" + count + "</strong>.";
                    if (data.created != null)
                        html += " Created: " + data.created + ".";
                    if (data.deleted != null && data.deleted > 0)
                        html += " 🗑️ " + data.deleted + ".";
                    html +=
                        ' <button onclick="fetchShows()">Refresh</button></p>';

                    // Also scan movies
                    try {
                        var md = await apiFetch("/api/movies/scan", {
                            method: "POST",
                        });
                        var mc =
                            md.movies_synced != null ? md.movies_synced : 0;
                        html +=
                            "<p>🎬 Movies: found <strong>" + mc + "</strong>.";
                        if (md.created != null)
                            html += " Created: " + md.created + ".";
                        if (md.deleted != null && md.deleted > 0)
                            html += " 🗑️ " + md.deleted + ".";
                        html += "</p>";
                    } catch (e) {
                        html +=
                            "<p>🎬 Movies: scan failed — " +
                            escapeHtml(e.message) +
                            "</p>";
                    }

                    el.innerHTML = html;
                } catch (e) {
                    el.innerHTML =
                        '<p class="error">Scan failed: ' +
                        escapeHtml(e.message) +
                        "</p>";
                }
            }

            // ── Init ───────────────────────────────────────────────────────
            fetchShows();
        </script>
    </body>
</html>
