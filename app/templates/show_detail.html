<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TV-Trac — Show</title>
        <script src="/static/app.js"></script>
        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e94560' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='7' width='20' height='14' rx='2'/%3E%3Cpolyline points='17 2 12 7 7 2'/%3E%3C/svg%3E"
        />
        <style>
            :root {
                --bg: #f4f6f9;
                --surface: #ffffff;
                --accent: #e94560;
                --text: #1a1a2e;
                --text-muted: #6b7280;
                --border: #e0e4e8;
                --content-max-width: 960px;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.6;
            }
            header {
                background: var(--surface);
                padding: 1.5rem 2rem;
                border-bottom: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            header h1 {
                font-size: 1.5rem;
                color: var(--accent);
            }
            header a {
                color: var(--text-muted);
                text-decoration: none;
                font-size: 0.85rem;
            }
            header a:hover {
                color: var(--accent);
            }
            nav {
                display: flex;
                gap: 0;
                border-bottom: 1px solid var(--border);
                margin-bottom: 1rem;
            }
            nav a {
                color: var(--text-muted);
                text-decoration: none;
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
                border-bottom: 2px solid transparent;
                cursor: pointer;
            }
            nav a.active {
                color: var(--accent);
                border-bottom-color: var(--accent);
            }
            main {
                max-width: var(--content-max-width);
                margin: 2rem auto;
                padding: 0 1rem;
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1.5rem;
                margin-bottom: 1rem;
            }
            .badge {
                display: inline-block;
                padding: 0.15rem 0.6rem;
                border-radius: 12px;
                font-size: 0.75rem;
                font-weight: 600;
            }
            .badge-watched {
                background: #2ecc71;
                color: #fff;
            }
            .badge-partial {
                background: #f39c12;
                color: #fff;
            }
            .badge-unwatched {
                background: var(--border);
                color: var(--text-muted);
            }
            .poster {
                width: 180px;
                height: 270px;
                object-fit: cover;
                border-radius: 8px;
                float: left;
                margin-right: 1.5rem;
                margin-bottom: 1rem;
                background: var(--border);
            }
            .show-header {
                display: flex;
                flex-wrap: wrap;
                align-items: flex-start;
            }
            .show-info {
                flex: 1;
                min-width: 250px;
            }
            .show-info h2 {
                font-size: 1.6rem;
                margin-bottom: 0.3rem;
            }
            .show-info .year {
                color: var(--text-muted);
                font-size: 1rem;
            }
            .show-info .overview {
                margin-top: 0.75rem;
                font-size: 0.95rem;
                color: var(--text);
            }
            .meta {
                color: var(--text-muted);
                font-size: 0.8rem;
                margin-top: 0.5rem;
            }
            .ext-link {
                color: var(--accent);
                text-decoration: none;
                font-size: 0.8rem;
            }
            .episode-list {
                list-style: none;
                margin-top: 0.5rem;
            }
            .episode-list li {
                padding: 0.5rem 0;
                border-bottom: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .episode-list li:last-child {
                border-bottom: none;
            }
            .season-poster {
                width: 40px;
                height: 58px;
                object-fit: cover;
                border-radius: 3px;
                margin-right: 0.5rem;
                vertical-align: middle;
                background: var(--border);
            }
            .episode-thumb {
                width: 64px;
                height: 36px;
                object-fit: cover;
                border-radius: 3px;
                margin-right: 0.6rem;
                flex-shrink: 0;
                background: var(--border);
            }
            .season-title {
                font-size: 1.1rem;
                font-weight: 600;
                margin: 1rem 0 0.25rem;
            }
            .loading {
                color: var(--text-muted);
                font-style: italic;
            }
            .info-icon {
                display: inline-block;
                width: 16px;
                height: 16px;
                line-height: 16px;
                text-align: center;
                border-radius: 50%;
                background: var(--border);
                color: var(--text-muted);
                font-size: 10px;
                font-weight: bold;
                cursor: pointer;
                margin: 0 0.3rem;
                vertical-align: middle;
            }
            .popover {
                position: fixed;
                z-index: 1000;
                background: var(--surface);
                border: 1px solid var(--accent);
                border-radius: 8px;
                padding: 0.75rem 1rem;
                max-width: 380px;
                font-size: 0.85rem;
                color: var(--text);
                line-height: 1.5;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            }
            .clearfix::after {
                content: "";
                display: table;
                clear: both;
            }
        </style>
    </head>
    <body>
        <header>
            <div>
                <div style="display: flex; align-items: center; gap: 0.5rem">
                    <svg
                        width="28"
                        height="28"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="#e94560"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <rect x="2" y="7" width="20" height="14" rx="2" />
                        <polyline points="17 2 12 7 7 2" />
                    </svg>
                    <h1><a href="/" style="color: inherit; text-decoration: none; font-size: inherit">TV-Trac</a></h1>
                </div>
                <p
                    style="
                        color: var(--text-muted);
                        font-size: 0.75rem;
                        margin-top: 0.1rem;
                    "
                >
                    Track your TV shows &amp; movies
                </p>
            </div>
            <div style="display:flex;align-items:center;gap:0.75rem;">
                <button
                    id="locale-toggle"
                    onclick="TVTracI18n.openPicker(this, onLocaleSelect, event)"
                    title="Change date/time format"
                    style="background:transparent;border:none;height:2rem;display:inline-flex;align-items:center;justify-content:center;padding:0 0.5rem;font-size:1rem;cursor:pointer;line-height:1;"
                >🏳️</button>
                <button
                    id="width-toggle"
                    onclick="TVTracWidth.cycle(this)"
                    title="Width: 960px"
                    style="background:#e0e4e8;border:none;color:var(--text);height:2rem;display:inline-flex;align-items:center;justify-content:center;padding:0 0.8rem;border-radius:6px;font-size:0.85rem;cursor:pointer;line-height:1;"
                >← 960px →</button>
                <a href="/">← Back to shows</a>
            </div>
        </header>
        <nav>
            <a href="/" class="active">📺 Shows</a>
            <a href="/?tab=movies">🎬 Movies</a>
            <a href="/recent-episodes">🕒 Recent Episodes</a>
        </nav>
        <main>
            <div id="detail" class="loading">Loading...</div>
        </main>

        <script>
            var SHOW_ID = {{ show_id }};
            var activePopover = null;

            function dismissPopover() { if (activePopover) { activePopover.remove(); activePopover = null; } }
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('info-icon')) {
                    e.stopPropagation(); e.preventDefault();
                    if (activePopover) { dismissPopover(); return; }
                    var overview = e.target.getAttribute('data-overview');
                    if (!overview) return;
                    var pop = document.createElement('div'); pop.className = 'popover'; pop.textContent = overview;
                    document.body.appendChild(pop);
                    var rect = e.target.getBoundingClientRect();
                    var top = rect.bottom + 4, left = Math.max(8, rect.left - 180);
                    if (top + 120 > window.innerHeight) top = rect.top - 130;
                    pop.style.top = top + 'px'; pop.style.left = left + 'px';
                    activePopover = pop; return;
                }
                // Don't dismiss if clicking inside the active popover
                if (activePopover && activePopover.contains(e.target)) return;
                if (activePopover) dismissPopover();
            }, true);

            function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
            function infoIcon(overview) { if (!overview) return ''; return '<span class="info-icon" data-overview="'+escapeHtml(overview).replace(/"/g,'&quot;')+'" title="Overview">i</span>'; }
            function watchBadgeClass(s) { if (s==='watched') return 'badge-watched'; if (s==='partial') return 'badge-partial'; return 'badge-unwatched'; }
            function watchBadgeLabel(s) { if (s==='watched') return 'watched'; if (s==='partial') return 'part watched'; return 'unwatched'; }

            async function loadDetail() {
                var el = document.getElementById('detail');
                try {
                    var resp = await fetch('/api/shows/' + SHOW_ID);
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    var show = await resp.json();
                    document.title = show.title + ' — TV-Trac';
                    el.innerHTML = render(show);
                    highlightEpisode();
                } catch (e) {
                    el.innerHTML = '<p style="color:var(--accent);">Failed to load: ' + escapeHtml(e.message) + '</p>';
                }
            }

            var expandedSeasons = {};

            function highlightEpisode() {
                var params = new URLSearchParams(window.location.search);
                var epId = params.get('episode');
                if (!epId) return;
                var li = document.querySelector('li[data-episode-id="' + epId + '"]');
                if (!li) return;
                var seasonCard = li.closest('.season-card');
                if (seasonCard) {
                    var body = seasonCard.querySelector('.season-body');
                    if (body) body.style.display = 'block';
                    var chevron = seasonCard.querySelector('.season-chevron');
                    if (chevron) chevron.textContent = '▾';
                    var seasonNum = seasonCard.getAttribute('data-season-number');
                    if (seasonNum) expandedSeasons[seasonNum] = true;
                }
                li.style.outline = '2px solid var(--accent)';
                li.style.background = 'rgba(233,69,96,0.08)';
                li.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }

            function render(show) {
                var seasonsHtml = show.seasons.map(function(season, idx) {
                    var eps = season.episodes.map(function(ep) {
                        return '<li data-episode-id="'+ep.id+'" data-season-number="'+season.season_number+'">'+
                            '<span style="display:flex;align-items:center;min-width:0;flex:1;">'+
                            (ep.image_path ? '<img class="episode-thumb" src="'+ep.image_path+'" onerror="this.style.display=\'none\'">' : '')+
                            '<span>S'+String(season.season_number).padStart(2,'0')+'E'+String(ep.episode_number).padStart(2,'0')+' - '+escapeHtml(ep.title||'Episode '+ep.episode_number)+(ep.runtime?' ('+ep.runtime+'m)':'')+(ep.air_date?' <span style="color:var(--text-muted);font-size:0.7rem;">'+formatDateLong(ep.air_date)+'</span>':'')+infoIcon(ep.overview)+'</span>'+
                            '</span>'+
                            '<span style="margin-left:auto;display:flex;align-items:center;gap:0.3rem;flex-shrink:0;">'+
                            (ep.watched_at?'<span style="color:var(--accent);font-size:0.65rem;cursor:pointer;text-decoration:underline;" onclick="openCalendar('+ep.id+',event)" title="Change watched date">('+formatDateLong(ep.watched_at.substring(0,10))+')</span>':'')+
                            '<span class="badge '+(ep.watched?'badge-watched':'badge-unwatched')+'" onclick="toggleEp('+ep.id+','+ep.watched+',event)" style="cursor:pointer;">'+(ep.watched?'✓ watched':'unwatched')+'</span></span></li>';
                    }).join('');
                    var collapsed = (expandedSeasons[season.season_number] !== undefined)
                        ? !expandedSeasons[season.season_number]
                        : (idx !== 0); // first season expanded, rest collapsed
                    return '<div class="season-card" data-season-number="'+season.season_number+'" style="border:1px solid var(--border);border-radius:6px;padding:0.5rem 0.75rem;margin-bottom:0.5rem;">' +
                        '<div class="season-header" onclick="toggleSeason(this)" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;">' +
                        '<span style="font-weight:600;display:flex;align-items:center;">'+
                        (season.poster_path ? '<img class="season-poster" src="'+season.poster_path+'" onerror="this.style.display=\'none\'">' : '')+
                        '<span>Season '+season.season_number+' <span class="badge '+watchBadgeClass(season.part_watched)+'" style="font-size:0.7rem;">'+watchBadgeLabel(season.part_watched)+'</span></span>'+
                        '</span>' +
                        '<span class="season-chevron" style="color:var(--text-muted);">'+(collapsed?'▸':'▾')+'</span>' +
                        '</div>' +
                        '<div class="season-body" style="display:'+(collapsed?'none':'block')+';"><ul class="episode-list">'+eps+'</ul></div>' +
                        '</div>';
                }).join('');

                return '<div class="card clearfix">' +
                    '<div class="show-header">' +
                    (show.poster_path ? '<img class="poster" src="'+show.poster_path+'" onerror="this.style.display=\'none\'">' : '') +
                    '<div class="show-info">' +
                        '<h2>'+escapeHtml(show.title)+' <span class="year">('+ (show.first_aired ? show.first_aired.substring(0,4) : '') +')</span></h2>' +
                        '<span class="badge '+watchBadgeClass(show.part_watched)+'">'+watchBadgeLabel(show.part_watched)+'</span>' +
                        (show.ended ? ' <span class="badge" style="background:#e0e4e8;color:#5b6472;font-size:0.7rem;" title="Marked as ended — no more seasons/episodes">ended</span>' : '') +
                        ((show.first_aired || show.last_aired || show.created_at)
                            ? '<div class="meta">' +
                                (show.first_aired ? 'First aired: ' + formatDateLong(show.first_aired) : '') +
                                (show.first_aired && show.last_aired ? ' - ' : '') +
                                (show.last_aired
                                    ? (show.ended ? 'Ended ' : 'Last aired ') + formatDateLong(show.last_aired)
                                    : '') +
                                (show.created_at ? ' &nbsp;·&nbsp; Date added: ' + formatDateLong(show.created_at.substring(0, 10)) : '') +
                              '</div>'
                            : '') +
                        '<div class="meta" style="display:flex;gap:0.5rem;flex-wrap:wrap;">' +
                            (show.tvdb_slug ? '<a class="ext-link" href="https://thetvdb.com/series/'+show.tvdb_slug+'" target="_blank">TheTVDB ↗</a>' : '') +
                            (show.imdb_id ? '<a class="ext-link" href="https://www.imdb.com/title/'+show.imdb_id+'/" target="_blank">IMDb ↗</a>' : '<span class="ext-link" onclick="editImdb(event)" style="cursor:pointer;">Add IMDb ID</span>') +
                        '</div>' +
                        (show.overview ? '<p class="overview">'+escapeHtml(show.overview)+'</p>' : '') +
                        (show.missing_count > 0 ? '<div style="margin-top:0.5rem;padding:0.5rem 0.75rem;background:rgba(233,69,96,0.1);border:1px solid var(--accent);border-radius:6px;font-size:0.85rem;">⚠ <strong>Missing episodes:</strong> '+escapeHtml(show.missing_details||'')+'</div>' : '') +
                        '<div style="margin-top:0.75rem;display:flex;gap:0.5rem;">' +
                            '<button onclick="toggleWatchlist(' + show.id + ',' + (!show.watchlist) + ')" style="'+(show.watchlist?'background:var(--accent);color:#fff;':'background:var(--border);color:var(--text);')+'border:none;padding:0.3rem 0.9rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">'+(show.watchlist?'★ On Watchlist':'☆ Add to Watchlist')+'</button>' +
                            '<button onclick="toggleHidden(' + show.id + ',' + (!show.hidden) + ')" style="background:var(--border);color:var(--text);border:none;padding:0.3rem 0.9rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">'+(show.hidden?'Unhide from listings':'Hide from listings')+'</button>' +
                            '<button onclick="toggleEnded(' + show.id + ',' + (!show.ended) + ')" style="background:var(--border);color:var(--text);border:none;padding:0.3rem 0.9rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">'+(show.ended?'Mark as ongoing':'Mark as ended')+'</button>' +
                        '</div>' +
                        '<div style="margin-top:0.75rem;">' +
                            '<span style="font-size:0.8rem;color:var(--text-muted);margin-right:0.5rem;">Rating:</span>' +
                            renderStars(show.id, show.rating) +
                        '</div>' +
                    '</div>' +
                    '</div>' +
                    '</div>' +
                    '<div class="card">' +
                        '<div style="margin-bottom:0.5rem;"><strong>Notes</strong>' +
                            '<button onclick="editNotes(event)" style="background:none;border:1px solid var(--border);color:var(--text);padding:0.15rem 0.6rem;border-radius:4px;font-size:0.7rem;margin-left:0.5rem;cursor:pointer;">'+(show.notes?'Edit':'Add')+'</button>' +
                        '</div>' +
                        '<div id="notes-display">'+(show.notes?escapeHtml(show.notes):'<span style="color:var(--text-muted);font-size:0.8rem;">No notes yet</span>')+'</div>' +
                    '</div>' +
                    '<div class="card">' +
                        '<div style="display:flex;align-items:center;margin-bottom:0.5rem;">' +
                            '<strong style="min-width:0;">Seasons: total ' + (show.seasons.length + show.missing_season_count) + ', available ' + show.seasons.length + (show.missing_season_count > 0 ? ', <span style="color:var(--accent);">missing ' + show.missing_season_count + '</span>' : '') + '</strong>' +
                            '<span style="margin-left:auto;display:flex;align-items:center;gap:0.5rem;flex-shrink:0;">' +
                                '<a href="/" style="display:inline-flex;align-items:center;background:none;border:1px solid var(--border);color:var(--text);padding:0.15rem 0.6rem;border-radius:4px;font-size:0.7rem;cursor:pointer;text-decoration:none;white-space:nowrap;">← Back to shows</a>' +
                                '<button onclick="setAllSeasons(true)" style="background:none;border:1px solid var(--border);color:var(--text);padding:0.15rem 0.6rem;border-radius:4px;font-size:0.7rem;cursor:pointer;">Expand all</button>' +
                                '<button onclick="setAllSeasons(false)" style="background:none;border:1px solid var(--border);color:var(--text);padding:0.15rem 0.6rem;border-radius:4px;font-size:0.7rem;cursor:pointer;">Collapse all</button>' +
                            '</span>' +
                        '</div>' +
                        seasonsHtml +
                    '</div>';
            }

            function setAllSeasons(expand) {
                document.querySelectorAll('.season-card').forEach(function(card) {
                    var body = card.querySelector('.season-body');
                    var chevron = card.querySelector('.season-chevron');
                    body.style.display = expand ? 'block' : 'none';
                    chevron.textContent = expand ? '▾' : '▸';
                    var seasonNum = card.getAttribute('data-season-number');
                    if (seasonNum) expandedSeasons[seasonNum] = expand;
                });
            }

            function toggleSeason(headerEl) {
                var card = headerEl.closest('.season-card');
                var body = card.querySelector('.season-body');
                var chevron = headerEl.querySelector('.season-chevron');
                var isHidden = body.style.display === 'none';
                body.style.display = isHidden ? 'block' : 'none';
                chevron.textContent = isHidden ? '▾' : '▸';
                var seasonNum = card.getAttribute('data-season-number');
                if (seasonNum) expandedSeasons[seasonNum] = isHidden;
            }

            function editNotes(ev) {
                ev.stopPropagation();
                var display = document.getElementById('notes-display');
                var current = display.textContent === 'No notes yet' ? '' : display.textContent;
                display.innerHTML = '<textarea id="notes-ta" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:0.5rem;font-size:0.85rem;resize:vertical;min-height:70px;font-family:inherit;">'+escapeHtml(current)+'</textarea>' +
                    '<div style="margin-top:0.5rem;"><button onclick="saveNotes()" style="background:var(--accent);color:#fff;border:none;padding:0.3rem 0.9rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">Save</button> ' +
                    '<button onclick="loadDetail()" style="background:var(--border);color:var(--text);border:none;padding:0.3rem 0.9rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">Cancel</button></div>';
            }

            async function saveNotes() {
                var ta = document.getElementById('notes-ta');
                var notes = ta ? ta.value : '';
                await fetch('/api/shows/'+SHOW_ID+'/notes?notes='+encodeURIComponent(notes), {method:'PATCH'});
                loadDetail();
            }

            function editImdb(ev) {
                ev.stopPropagation();
                var link = ev.target;
                link.innerHTML = '<input type="text" id="imdb-input" placeholder="tt9059820" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:0.2rem;font-size:0.75rem;width:120px;">';
                var input = document.getElementById('imdb-input');
                input.focus();
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') saveImdb();
                });
            }

            async function saveImdb() {
                var input = document.getElementById('imdb-input');
                var id = input ? input.value.trim() : '';
                await fetch('/api/shows/'+SHOW_ID+'/imdb?imdb_id='+encodeURIComponent(id), {method:'PATCH'});
                loadDetail();
            }

            async function toggleHidden(showId, hidden) {
                await fetch('/api/shows/'+showId+'/hidden?hidden='+hidden, {method:'PATCH'});
                loadDetail();
            }

            async function toggleWatchlist(showId, watchlist) {
                await fetch('/api/shows/'+showId+'/watchlist?watchlist='+watchlist, {method:'PATCH'});
                loadDetail();
            }

            async function toggleEnded(showId, ended) {
                await fetch('/api/shows/'+showId+'/ended?ended='+ended, {method:'PATCH'});
                loadDetail();
            }

            function renderStars(showId, rating) {
                var html = '';
                for (var i = 1; i <= 5; i++) {
                    var filled = i <= rating;
                    html += '<span onclick="setRating(' + showId + ',' + i + ')" style="cursor:pointer;font-size:1.3rem;color:' + (filled ? '#f1c40f' : '#b0b8c4') + ';">' + (filled ? '★' : '☆') + '</span>';
                }
                if (rating > 0) {
                    html += ' <span onclick="setRating(' + showId + ',0)" style="cursor:pointer;font-size:0.7rem;color:var(--text-muted);margin-left:0.5rem;">clear</span>';
                }
                return html;
            }

            async function setRating(showId, rating) {
                await fetch('/api/shows/'+showId+'/rating?rating='+rating, {method:'PATCH'});
                loadDetail();
            }

            var calYear = null, calMonth = null, calEpId = null, calSelectedDay = null;
            var CAL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

            async function toggleEp(epId, currentlyWatched, ev) {
                ev.stopPropagation();
                await fetch('/api/shows/episodes/'+epId+'/watch?watched='+(!currentlyWatched), {method:'PATCH'});
                loadDetail();
            }

            function openCalendar(epId, ev) {
                ev.stopPropagation();
                dismissPopover();
                var now = new Date();
                calEpId = epId;
                calYear = now.getFullYear();
                calMonth = now.getMonth();
                calSelectedDay = null;
                var pop = document.createElement('div');
                pop.className = 'popover';
                pop.id = 'cal-popover';
                document.body.appendChild(pop);
                activePopover = pop;
                renderCalendar();
                // Position after render so we can measure the popup height
                var rect = ev.target.getBoundingClientRect();
                var popHeight = pop.offsetHeight || 300;
                var top = rect.bottom + 4;
                if (top + popHeight > window.innerHeight) {
                    top = rect.top - popHeight - 4;
                }
                if (top < 4) top = 4;
                var left = Math.max(8, rect.left - 200);
                pop.style.top = top + 'px';
                pop.style.left = left + 'px';
            }

            function renderCalendar() {
                var pop = document.getElementById('cal-popover');
                if (!pop) return;
                var first = new Date(calYear, calMonth, 1);
                var startDay = first.getDay();
                var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

                var monthOpts = '';
                for (var m=0; m<12; m++) monthOpts += '<option value="'+m+'"'+(m===calMonth?' selected':'')+'>'+CAL_MONTHS[m]+'</option>';
                var yearOpts = '';
                for (var y=calYear-20; y<=calYear+1; y++) yearOpts += '<option value="'+y+'"'+(y===calYear?' selected':'')+'>'+y+'</option>';

                var html = '<div style="display:flex;gap:0.3rem;margin-bottom:0.4rem;">' +
                    '<select onchange="calMonth=parseInt(this.value);renderCalendar()" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:0.2rem;font-size:0.75rem;flex:2;">'+monthOpts+'</select>' +
                    '<select onchange="calYear=parseInt(this.value);renderCalendar()" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:0.2rem;font-size:0.75rem;flex:1;">'+yearOpts+'</select>' +
                    '</div>' +
                    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;">';
                var days = ['Su','Mo','Tu','We','Th','Fr','Sa'];
                for (var i=0;i<7;i++) html += '<span style="font-size:0.65rem;color:var(--text-muted);">'+days[i]+'</span>';
                for (var j=0;j<startDay;j++) html += '<span></span>';
                for (var d=1;d<=daysInMonth;d++) {
                    var isSel = (d === calSelectedDay);
                    html += '<button onclick="calSelectedDay='+d+';renderCalendar()" style="'+(isSel?'background:var(--accent);color:#fff;':'background:none;color:var(--text);')+'border:none;padding:0.2rem;font-size:0.8rem;cursor:pointer;border-radius:4px;">'+d+'</button>';
                }
                html += '</div>' +
                    '<div style="margin-top:0.5rem;">' +
                    '<button onclick="saveCalendar()" style="background:var(--accent);color:#fff;font-size:0.75rem;">Save</button> ' +
                    '<button onclick="unmarkEp(calEpId)" style="background:var(--border);color:var(--text);font-size:0.75rem;">Unmark</button> ' +
                    '<button onclick="dismissPopover()" style="background:var(--border);color:var(--text);font-size:0.75rem;">Cancel</button>' +
                    '</div>';
                pop.innerHTML = html;
            }

            async function saveCalendar() {
                if (!calSelectedDay) { return; }
                var d = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(calSelectedDay).padStart(2,'0');
                await fetch('/api/shows/episodes/'+calEpId+'/watch?watched=true&watched_at='+d, {method:'PATCH'});
                dismissPopover();
                loadDetail();
            }

            async function unmarkEp(epId) {
                await fetch('/api/shows/episodes/'+epId+'/watch?watched=false', {method:'PATCH'});
                dismissPopover();
                loadDetail();
            }

            function onLocaleSelect() {
                loadDetail();
            }
            document.getElementById('locale-toggle').textContent = TVTracI18n.currentFlag();
            document.getElementById('locale-toggle').title = TVTracI18n.currentLabel();

            loadDetail();
        </script>
    </body>
</html>
