<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recently Aired — TV-Trac</title>
    <script src="/static/app.js"></script>
    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e94560' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='7' width='20' height='14' rx='2'/%3E%3Cpolyline points='17 2 12 7 7 2'/%3E%3C/svg%3E"
    />
    <style>
        :root {
            --bg: #f4f6f9;
            --surface: #ffffff;
            --accent: #e94560;
            --text: #1a1a2e;
            --text-muted: #6b7280;
            --border: #e0e4e8;
            --content-max-width: 960px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
                Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        header {
            background: var(--surface);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
        }
        header p {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 0.1rem;
        }
        header a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
        }
        header a:hover {
            color: var(--accent);
        }
        nav {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-bottom: 2px solid transparent;
            cursor: pointer;
        }
        nav a.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        main {
            max-width: var(--content-max-width);
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .toolbar h2 {
            font-size: 1.1rem;
            margin-right: auto;
        }
        .toolbar select,
        .toolbar label {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.4rem 0.6rem;
            font-size: 0.8rem;
        }
        .hide-watched {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .filter-wrap {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            overflow: hidden;
            flex: 1 1 200px;
        }
        .filter-input {
            border: none;
            background: transparent;
            color: var(--text);
            padding: 0.4rem 0.6rem;
            font-size: 0.8rem;
            min-width: 120px;
            outline: none;
            flex: 1;
        }
        .filter-clear {
            border: none;
            background: none;
            color: var(--text-muted);
            padding: 0 0.5rem;
            cursor: pointer;
            font-size: 0.8rem;
            display: none;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .card h2 {
            font-size: 1.15rem;
            margin-bottom: 0.5rem;
        }
        .card h2 span {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 400;
        }
        .clear-btn {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .clear-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .episode-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
        }
        .episode-row:last-child {
            border-bottom: none;
        }
        .episode-row .thumb {
            width: 42px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            background: var(--border);
            flex-shrink: 0;
        }
        .episode-row .thumb.episode {
            width: 96px;
            height: 54px;
        }
        .episode-main {
            flex: 1;
            min-width: 0;
        }
        .episode-main .show-title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .episode-main .show-title a {
            color: var(--text);
            text-decoration: none;
        }
        .episode-main .show-title a:hover {
            color: var(--accent);
        }
        .episode-main .ep-title {
            color: var(--text);
            font-size: 0.85rem;
            margin-top: 0.15rem;
        }
        .episode-meta {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-top: 0.15rem;
        }
        .hidden-badge {
            background: #fde8ec;
            color: #b02a37;
            font-size: 0.65rem;
            padding: 0 0.4rem;
            border-radius: 3px;
            font-weight: 600;
            vertical-align: middle;
            margin-left: 0.3rem;
        }
        .unhide-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 0.65rem;
            padding: 0 0.4rem;
            border-radius: 3px;
            cursor: pointer;
            vertical-align: middle;
            margin-left: 0.3rem;
        }
        .unhide-btn:hover {
            border-color: var(--accent);
        }
        .badge {
            display: inline-block;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-watched {
            background: #e6f4ea;
            color: #137333;
        }
        .badge-unwatched {
            background: #eef0f3;
            color: #6b7280;
        }
        .info-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--border);
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }
        .popover {
            position: fixed;
            background: #1a1a2e;
            color: #fff;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            max-width: 360px;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            line-height: 1.4;
        }
        .loading,
        .error {
            color: var(--text-muted);
            padding: 1rem;
            text-align: center;
        }
        .error {
            color: var(--accent);
        }
        .page-nav {
            display: flex;
            gap: 0.25rem;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .page-nav button {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .page-nav button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .page-nav button:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .page-nav select {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.3rem;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 2rem;
        }
        footer a {
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <div>
            <div style="display: flex; align-items: center; gap: 0.5rem">
                <svg
                    width="28"
                    height="28"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#e94560"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect x="2" y="7" width="20" height="14" rx="2" />
                    <polyline points="17 2 12 7 7 2" />
                </svg>
                <h1><a href="/" style="color: inherit; text-decoration: none; font-size: inherit">TV-Trac</a></h1>
            </div>
            <p>Track your TV shows &amp; movies</p>
        </div>
        <div style="display:flex;align-items:center;gap:0.75rem;">
            <button
                id="locale-toggle"
                onclick="TVTracI18n.openPicker(this, onLocaleSelect, event)"
                title="Change date/time format"
                style="background:transparent;border:none;height:2rem;display:inline-flex;align-items:center;justify-content:center;padding:0 0.5rem;font-size:1rem;cursor:pointer;line-height:1;"
            >🏳️</button>
            <button
                id="width-toggle"
                onclick="TVTracWidth.cycle(this)"
                title="Width: 960px"
                style="background:#e0e4e8;border:none;color:var(--text);height:2rem;display:inline-flex;align-items:center;justify-content:center;padding:0 0.8rem;border-radius:6px;font-size:0.85rem;cursor:pointer;line-height:1;"
            >← 960px →</button>
            <a href="/">← Back to shows</a>
        </div>
    </header>

    <nav>
        <a href="/">📺 Shows</a>
        <a href="/?tab=movies">🎬 Movies</a>
        <a href="/recent-episodes" class="active">🕒 Recent Episodes</a>
    </nav>

    <main>
        <div class="toolbar">
            <div class="filter-wrap">
                <input
                    type="text"
                    id="filter"
                    class="filter-input"
                    placeholder="Filter shows/episodes..."
                    oninput="renderList()"
                />
                <button
                    class="filter-clear"
                    id="filter-clear"
                    onclick="clearFilter()"
                >
                    ✕
                </button>
            </div>
            <label for="mode">Type</label>
            <select id="mode" onchange="onModeChange()">
                <option value="aired" selected>Recently Aired</option>
                <option value="added">Recently Added</option>
            </select>
            <span id="days-wrap" style="display:none;align-items:center;gap:0.5rem;">
                <label for="days">Added in</label>
                <select id="days" onchange="load()">
                    <option value="" selected>All time</option>
                    <option value="1">Last 1 day</option>
                    <option value="3">Last 3 days</option>
                    <option value="7">Last 7 days</option>
                    <option value="30">Last 30 days</option>
                </select>
            </span>
            <label for="order">Order</label>
            <select id="order" onchange="load()">
                <option value="desc" selected>Newest first</option>
                <option value="asc">Oldest first</option>
            </select>
            <label for="show-limit">Show</label>
            <select id="show-limit" onchange="load()">
                <option value="10">Last 10</option>
                <option value="20">Last 20</option>
                <option value="30">Last 30</option>
                <option value="50" selected>Last 50</option>
                <option value="100">Last 100</option>
                <option value="200">Last 200</option>
                <option value="500">Last 500</option>
                <option value="1000">All</option>
            </select>
            <label class="hide-watched">
                <input type="checkbox" id="hide-watched" onchange="load()" />
                Hide watched
            </label>
            <button class="clear-btn" onclick="clearAll()">✕ Clear</button>
        </div>

        <div class="card">
            <h2><span id="page-title">Recently Aired Episodes</span> <span id="episode-count"></span></h2>
            <div id="list" class="loading">Loading episodes...</div>
            <div id="pagination" class="page-nav"></div>
        </div>
    </main>

    <footer>
        TV data provided by <a href="https://thetvdb.com" target="_blank">TheTVDB</a>.
    </footer>

    <script>
        var activePopover = null;
        function dismissPopover() { if (activePopover) { activePopover.remove(); activePopover = null; } }
        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('info-icon')) {
                e.stopPropagation(); e.preventDefault();
                if (activePopover) { dismissPopover(); return; }
                var overview = e.target.getAttribute('data-overview');
                if (!overview) return;
                var pop = document.createElement('div'); pop.className = 'popover'; pop.textContent = overview;
                document.body.appendChild(pop);
                var rect = e.target.getBoundingClientRect();
                var top = rect.bottom + 4, left = Math.max(8, rect.left - 180);
                if (top + 120 > window.innerHeight) top = rect.top - 130;
                pop.style.top = top + 'px'; pop.style.left = left + 'px';
                activePopover = pop; return;
            }
            if (activePopover && activePopover.contains(e.target)) return;
            if (activePopover) dismissPopover();
        }, true);

        function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function infoIcon(overview) { if (!overview) return ''; return '<span class="info-icon" data-overview="' + escapeHtml(overview).replace(/"/g, '&quot;') + '" title="Overview">i</span>'; }

        function pad(n) { return String(n).padStart(2, '0'); }

        async function unhideShow(showId) {
            await fetch('/api/shows/' + showId + '/hidden?hidden=false', { method: 'PATCH' });
            load();
        }

        var allEpisodes = [];
        var epPage = 1;
        var epPerPage = 10;
        var currentMode = 'aired';

        async function load() {
            var el = document.getElementById('list');
            var mode = document.getElementById('mode').value;
            var days = document.getElementById('days').value;
            var order = document.getElementById('order').value;
            var excludeWatched = document.getElementById('hide-watched').checked;
            var limit = document.getElementById('show-limit').value;
            currentMode = mode;
            document.getElementById('page-title').textContent =
                mode === 'added' ? 'Recently Added Episodes' : 'Recently Aired Episodes';
            epPage = 1;
            el.className = 'loading';
            el.textContent = 'Loading episodes...';
            try {
                var url = '/api/episodes/recent?mode=' + mode +
                    '&order=' + order +
                    '&exclude_watched=' + excludeWatched +
                    '&limit=' + limit;
                if (mode === 'added' && days) url += '&days=' + days;
                var resp = await fetch(url);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                var data = await resp.json();
                allEpisodes = data.episodes || [];
                renderList();
            } catch (e) {
                allEpisodes = [];
                el.className = '';
                el.innerHTML = '<p class="error">Failed: ' + escapeHtml(e.message) + '</p>';
            }
        }

        function onModeChange() {
            var mode = document.getElementById('mode').value;
            document.getElementById('days-wrap').style.display =
                mode === 'added' ? 'inline-flex' : 'none';
            load();
        }

        function clearFilter() {
            document.getElementById('filter').value = '';
            renderList();
        }

        function clearAll() {
            document.getElementById('filter').value = '';
            document.getElementById('mode').value = 'aired';
            document.getElementById('days').value = '';
            document.getElementById('order').value = 'desc';
            document.getElementById('show-limit').value = '50';
            document.getElementById('hide-watched').checked = false;
            onModeChange();
        }

        function renderList() {
            var el = document.getElementById('list');
            var filter = document.getElementById('filter').value.toLowerCase().trim();
            document.getElementById('filter-clear').style.display = filter ? 'inline-block' : 'none';

            var eps = allEpisodes;
            if (filter) {
                eps = eps.filter(function (ep) {
                    var hay = (ep.show_title || '') + ' ' + (ep.title || '') + ' S' + pad(ep.season_number) + 'E' + pad(ep.episode_number);
                    return hay.toLowerCase().indexOf(filter) !== -1;
                });
            }

            document.getElementById('episode-count').textContent = '(' + eps.length + ')';

            if (!eps.length) {
                el.className = '';
                el.innerHTML = '<p class="loading">No episodes match.</p>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            epPage = Math.min(epPage, Math.ceil(eps.length / epPerPage) || 1);
            var start = (epPage - 1) * epPerPage;
            var paged = eps.slice(start, start + epPerPage);

            el.className = '';
            el.innerHTML = paged.map(function (ep) {
                var link = '/show/' + ep.show_id + '?episode=' + ep.id + '&season=' + ep.season_number;
                var thumbSrc = ep.episode_image || ep.show_poster;
                var isEpisode = !!ep.episode_image;
                var meta = currentMode === 'added'
                    ? 'Added: ' + (ep.added_at ? formatDateLong(ep.added_at.substring(0, 10)) : '') +
                        (ep.air_date ? ' · Aired: ' + formatDateLong(ep.air_date) : '')
                    : (ep.air_date ? 'Aired: ' + formatDateLong(ep.air_date) : '');
                return '<div class="episode-row">' +
                    (thumbSrc
                        ? '<img class="thumb' + (isEpisode ? ' episode' : '') + '" src="' + thumbSrc + '" onerror="this.style.display=\'none\'">'
                        : '<div class="thumb"></div>') +
                    '<div class="episode-main">' +
                        '<div class="show-title"><a href="' + link + '">' + escapeHtml(ep.show_title || 'Unknown show') + '</a>' +
                        (ep.show_hidden
                            ? ' <span class="hidden-badge" title="This show is hidden from the main listings">👁 hidden</span>' +
                              ' <button class="unhide-btn" onclick="unhideShow(' + ep.show_id + ')">unhide</button>'
                            : '') +
                        '</div>' +
                        '<div class="ep-title">S' + pad(ep.season_number) + 'E' + pad(ep.episode_number) + ' - ' + escapeHtml(ep.title || 'Episode ' + ep.episode_number) + (ep.runtime ? ' (' + ep.runtime + 'm)' : '') + '</div>' +
                        '<div class="episode-meta">' + meta + '</div>' +
                    '</div>' +
                    infoIcon(ep.overview) +
                    '<span class="badge ' + (ep.watched ? 'badge-watched' : 'badge-unwatched') + '">' + (ep.watched ? '✓ watched' : 'unwatched') + '</span>' +
                '</div>';
            }).join('');

            renderPagination(eps.length);
        }

        function renderPagination(total) {
            var el = document.getElementById('pagination');
            var pages = Math.ceil(total / epPerPage) || 1;
            var html = '';
            if (total > epPerPage) {
                html += '<button onclick="goPage(' + (epPage - 1) + ')"' + (epPage <= 1 ? ' disabled' : '') + '>« Prev</button>';
                var start = Math.max(1, epPage - 2);
                var end = Math.min(pages, epPage + 2);
                for (var i = start; i <= end; i++) {
                    html += '<button class="' + (i === epPage ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
                }
                html += '<button onclick="goPage(' + (epPage + 1) + ')"' + (epPage >= pages ? ' disabled' : '') + '>Next »</button>';
            }
            html += '<select onchange="goPerPage(this.value)">' +
                '<option value="10"' + (epPerPage === 10 ? ' selected' : '') + '>10</option>' +
                '<option value="25"' + (epPerPage === 25 ? ' selected' : '') + '>25</option>' +
                '<option value="50"' + (epPerPage === 50 ? ' selected' : '') + '>50</option>' +
                '<option value="100"' + (epPerPage === 100 ? ' selected' : '') + '>100</option>' +
                '</select>';
            el.innerHTML = html;
        }

        function goPage(p) {
            epPage = p;
            renderList();
        }

        function goPerPage(n) {
            epPerPage = parseInt(n);
            epPage = 1;
            renderList();
        }

        function onLocaleSelect() {
            renderList();
        }
        document.getElementById('locale-toggle').textContent = TVTracI18n.currentFlag();
        document.getElementById('locale-toggle').title = TVTracI18n.currentLabel();

        load();
    </script>
</body>
</html>
